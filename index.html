  <!-- 手書き風フォント（Caveat）の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       1. デザインシステム & カラーパレット
       ========================================================== */
    :root {
      --g-blue: #4285f4;
      --g-red: #ea4335;
      --g-yellow: #fbbc05;
      --g-green: #34a853;

      /* ライトモード */
      --bg-base: #f0f4f9;
      --text-main: #111827;
      --btn-primary-bg: #1a73e8;
      --btn-primary-text: #ffffff;
      --btn-hover: #1557b0;
      --glow-color: rgba(26, 115, 232, 0.35);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* ダークモード */
        --bg-base: #0a0e17;
        --text-main: #f3f4f6;
        --btn-primary-bg: #8ab4f8;
        --btn-primary-text: #061121;
        --btn-hover: #aecbfa;
        --glow-color: rgba(138, 180, 248, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================
       2. 背景キャンバス & オーロラグロー
       ========================================================== */
    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      width: 70vw;
      height: 70vw;
      max-width: 800px;
      max-height: 800px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 14s infinite alternate ease-in-out;
    }

    .glow-1 { top: -20%; left: -10%; background: var(--g-blue); }
    .glow-2 { bottom: -20%; right: -10%; background: var(--g-red); animation-delay: -7s; }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(0.9); }
      100% { transform: translate(50px, 30px) scale(1.1); }
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.03);
      z-index: 0;
      pointer-events: none;
    }

    /* ==========================================================
       3. メインコンテンツ（welcome & ボタン）
       ========================================================== */
    .welcome-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      text-align: center;
      padding: 20px;
    }

    /* 手書きアニメーション welcome テキスト */
    .glass-welcome {
      font-family: 'Caveat', cursive;
      font-size: clamp(4.5rem, 15vw, 8.5rem);
      color: var(--text-main);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      letter-spacing: 0.05em;
      display: inline-flex;
    }

    .glass-welcome span {
      display: inline-block;
      opacity: 0;
      transform: translateY(15px) rotate(-5deg);
      animation: writeChar 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* 各文字のアニメーション開始ディレイ */
    .glass-welcome span:nth-child(1) { animation-delay: 0.1s; }
    .glass-welcome span:nth-child(2) { animation-delay: 0.3s; }
    .glass-welcome span:nth-child(3) { animation-delay: 0.5s; }
    .glass-welcome span:nth-child(4) { animation-delay: 0.7s; }
    .glass-welcome span:nth-child(5) { animation-delay: 0.9s; }
    .glass-welcome span:nth-child(6) { animation-delay: 1.1s; }
    .glass-welcome span:nth-child(7) { animation-delay: 1.3s; }

    @keyframes writeChar {
      0% {
        opacity: 0;
        transform: translateY(15px) rotate(-5deg) scale(0.8);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
        filter: blur(0);
      }
    }

    /* 次へボタン */
    .btn-next {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 42px;
      border-radius: 100px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      box-shadow: 0 8px 24px var(--glow-color);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.25s ease,
                  box-shadow 0.25s ease;
      pointer-events: none;
    }

    /* アニメーション終了後に付与する表示用クラス */
    .btn-next.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn-next:hover {
      background-color: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px var(--glow-color);
    }

    .btn-next:active {
      transform: translateY(0);
      box-shadow: 0 4px 16px var(--glow-color);
    }

    .btn-next svg {
      width: 20px;
      height: 20px;
      transition: transform 0.25s ease;
    }

    .btn-next:hover svg {
      transform: translateX(4px);
    }
    #instanceFrame { position: fixed; inset: 0; z-index: 100; width: 100%; height: 100%; border: 0; background: var(--bg-base); }
    #instanceFrame[hidden] { display: none; }
    #instanceFrame { opacity: 0; transition: opacity .6s ease; }
    #instanceFrame.is-shown { opacity: 1; }
    .welcome-container, .ambient-glow, #particleCanvas { transition: opacity .9s ease, filter .9s ease; }
    body.welcome-fade .welcome-container { opacity: 0; filter: blur(6px); }
    body.welcome-fade .ambient-glow, body.welcome-fade #particleCanvas { opacity: 0; }

    /* スキップボタン（右下） */
    .btn-skip {
      position: fixed;
      right: calc(20px + env(safe-area-inset-right, 0px));
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      padding: 10px 22px;
      border-radius: 100px;
      border: 1px solid color-mix(in srgb, var(--text-main) 25%, transparent);
      background: color-mix(in srgb, var(--bg-base) 55%, transparent);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--text-main);
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .05em;
      cursor: pointer;
      transition: opacity .9s ease, background-color .25s ease, transform .25s ease;
    }
    .btn-skip:hover { background: color-mix(in srgb, var(--bg-base) 85%, var(--text-main) 15%); transform: translateY(-2px); }
    .btn-skip:focus-visible { outline: 2px solid var(--btn-primary-bg); outline-offset: 3px; }
    body.welcome-fade .btn-skip { opacity: 0; pointer-events: none; }
    body.instance-active .btn-skip { display: none; }
    body.instance-active { overflow: hidden; }
    body.instance-active .ambient-glow,
    body.instance-active .bg-overlay,
    body.instance-active #particleCanvas,
    body.instance-active .welcome-container { display: none; }
  </style>
</head>
<body>

  <!-- 背景オーロラ & パーティクル -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="bg-overlay"></div>
  <canvas id="particleCanvas"></canvas>

  <!-- 中央コンテンツ -->
  <main class="welcome-container">
    <!-- 手書き風アニメーション welcome -->
    <div class="glass-welcome">
      <span>w</span><span>e</span><span>l</span><span>c</span><span>o</span><span>m</span><span>e</span>
    </div>

  </main>

  <!-- 右下のスキップボタン -->
  <button type="button" class="btn-skip" id="skipBtn" aria-label="スキップしてポータルへ進む">スキップ ›</button>

  <iframe id="instanceFrame" title="仲良しインスタンス2 — 情報ポータル" hidden></iframe>

  <script>
    // ==========================================================
    // 1. パーティクルキャンバス制御
    // ==========================================================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = Array.from({ length: 30 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 2.5 + 1,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.2
    }));

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = isDark ? `rgba(255, 255, 255, ${p.alpha})` : `rgba(0, 0, 0, ${p.alpha * 0.35})`;
        ctx.fill();
      });

      if (!window.__welcomeDone) particleRaf = requestAnimationFrame(animateParticles);
    }
    let particleRaf = 0;
    animateParticles();

    // ==========================================================
    // 2. アニメーション完了後のボタン表示制御
    // ==========================================================
    // welcome アニメーション後、自動でフェードアウトしてポータルを表示
    let instanceStarted = false;
    function showInstance() {
      if (instanceStarted) return;
      instanceStarted = true;
      const frame = document.getElementById('instanceFrame');
      const source = document.getElementById('instanceSource');
      if (!frame || !source) return;
      let loaded = false, faded = false;
      const reveal = () => {
        if (!loaded || !faded) return;
        window.__welcomeDone = true;
        cancelAnimationFrame(particleRaf);
        frame.hidden = false;
        requestAnimationFrame(() => frame.classList.add('is-shown'));
        document.body.classList.add('instance-active');
        document.title = '仲良し *インスタンス* 2 — 情報ポータル';
      };
      frame.addEventListener('load', () => {
        const innerDocument = frame.contentDocument;
        loaded = true; reveal();
      }, { once: true });
      document.body.classList.add('welcome-fade');
      setTimeout(() => { faded = true; reveal(); }, 900);
      frame.srcdoc = source.content.textContent;
    }
    // スキップ：アニメーションを待たずにすぐポータルへ
    document.getElementById('skipBtn').addEventListener('click', showInstance);

    // 手書きアニメーションが本当に終わってから（最後の文字の animationend）少し余韻を置いて自動で消える
    (function waitForWelcomeEnd() {
      const spans = document.querySelectorAll('.glass-welcome span');
      const last = spans[spans.length - 1];
      let done = false;
      const finish = () => { if (done) return; done = true; setTimeout(showInstance, 700); };
      if (last) {
        last.addEventListener('animationend', finish, { once: true });
        // 万が一 animationend が発火しない環境向けの保険（最終ディレイ1.3s+0.4s+余韻）
        setTimeout(finish, 3000);
      } else {
        setTimeout(showInstance, 2300);
      }
    })();
  </script>

.header-search input{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  padding:8px 12px;border-radius:4px;font-size:.85rem;width:220px;outline:none;
}
.header-search input:focus{border-color:var(--primary)}
.icon-btn{
  background:transparent;border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:4px;cursor:pointer;font-size:1rem;
}
.icon-btn:hover{background:var(--surface-2)}
.theme-toggle-btn{border:none !important;background:transparent;border-radius:8px}
.theme-toggle-btn:hover{background:color-mix(in oklab, var(--primary) 15%, transparent)}

/* ───── グローバルナビ ───── */
.gnav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.gnav-inner{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;overflow-x:hidden}
.gnav-links{display:flex;flex-wrap:wrap;align-items:center;gap:0;width:100%}
.gnav a{
  padding:10px 13px;color:var(--text);font-weight:500;font-size:.88rem;
  border-bottom:3px solid transparent;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.nav-ic{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.gnav a:hover .nav-ic,.gnav a.active .nav-ic{opacity:1}
.gnav a:hover{color:var(--primary);text-decoration:none;background:var(--surface-2)}
.gnav a.active{color:var(--primary);border-bottom-color:var(--primary)}
.gnav .menu-toggle{display:none}

/* ───── レイアウト ───── */
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:1fr 320px;gap:28px}
.main{min-width:0}
.aside{min-width:0}
@media (max-width:880px){
  .wrap{grid-template-columns:1fr}
  .header-search input{width:140px}
}
/* タブレット幅も含め、ハンバーガーメニューに切り替え */
@media (max-width:1024px){
  .gnav .menu-toggle{display:flex;align-items:center;justify-content:center;padding:12px 14px;border:none;background:transparent;color:var(--text);cursor:pointer;font-size:1.2rem}
  .gnav-inner &gt; .gnav-links{display:none;flex-direction:column;width:100%}
  .gnav-inner.open &gt; .gnav-links{display:flex}
  .gnav-inner{flex-wrap:wrap}
  .gnav a{width:100%;border-bottom:1px solid var(--border)}
}

/* ───── ヒーロー（情報サイト風の特集） ───── */
.hero{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:30px;margin-bottom:24px;
  display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;
}
.hero h1{font-size:1.7rem;margin:0 0 8px}
.hero p{margin:0;color:var(--text-muted)}
.hero .tag{display:inline-block;background:var(--tag-bg);color:var(--primary);font-size:.72rem;padding:3px 10px;border-radius:3px;font-weight:700;margin-bottom:10px;letter-spacing:.05em}
@media(max-width:600px){.hero{grid-template-columns:1fr}}

/* ───── ホーム専用（リデザイン） ───── */
#home-page .home-hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(1200px 400px at 100% -20%, color-mix(in oklab, var(--primary) 22%, transparent), transparent 60%),
    radial-gradient(600px 300px at 0% 120%, color-mix(in oklab, var(--primary) 14%, transparent), transparent 60%),
    var(--surface);
  border:1px solid var(--border);
  padding:40px 36px;
  display:grid;grid-template-columns:1.4fr .8fr;gap:24px;align-items:center;
}
#home-page .home-hero h1{font-size:2rem;line-height:1.25;margin:6px 0 10px;letter-spacing:-.01em}
#home-page .home-hero h1 em{font-style:normal;color:var(--primary);font-weight:800}
#home-page .home-hero p{max-width:56ch;font-size:.95rem;line-height:1.7}
#home-page .home-hero-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
#home-page .home-hero .btn-ghost{
  background:transparent;color:var(--text);
  border:1px solid var(--border);
}
#home-page .home-hero .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
#home-page .home-hero-deco{
  align-self:stretch;min-height:120px;border-radius:12px;
  background:
    conic-gradient(from 210deg at 70% 30%, color-mix(in oklab, var(--primary) 40%, transparent), transparent 45%),
    linear-gradient(135deg, color-mix(in oklab, var(--primary) 18%, transparent), transparent 60%);
  border:1px solid var(--border);
  mask:linear-gradient(180deg,#000 60%,transparent);
}
@media(max-width:820px){
  #home-page .home-hero{grid-template-columns:1fr;padding:28px 22px}
  #home-page .home-hero-deco{display:none}
  #home-page .home-hero h1{font-size:1.55rem}
}

#home-page .home-quick{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;
}
#home-page .home-quick a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:14px 8px;border-radius:14px;background:var(--surface-2,var(--surface));
  border:1px solid var(--border);color:var(--text);text-decoration:none;
  font-size:.78rem;font-weight:600;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
#home-page .home-quick a:hover{
  transform:translateY(-3px);border-color:var(--primary);text-decoration:none;
  box-shadow:0 10px 22px -14px color-mix(in oklab, var(--primary) 55%, transparent);
}
#home-page .home-quick a svg{
  width:22px;height:22px;fill:none;stroke:currentColor;color:var(--primary);
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
@media(max-width:480px){
  #home-page .home-quick{grid-template-columns:repeat(3,1fr)}
}

#home-page .home-grid-2{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;
}
#home-page .home-grid-2 .section{margin-bottom:0;height:100%}
@media(max-width:820px){
  #home-page .home-grid-2{grid-template-columns:1fr}
}

#home-page .section{transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease}
#home-page .section:hover{
  border-color:color-mix(in oklab, var(--primary) 45%, var(--border));
}
#home-page .section-head{
  background:linear-gradient(180deg, color-mix(in oklab, var(--primary) 4%, transparent), transparent);
}

/* ───── セクション共通 ───── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:24px}
.section-head{
  padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.section-head h2{font-size:1.1rem;margin:0;display:flex;align-items:center;gap:10px}
.section-head h2::before{content:"";width:4px;height:18px;background:var(--primary);border-radius:2px}
.section-head .more{font-size:.8rem;color:var(--text-muted)}
.section-body{padding:18px 20px}

/* ニュース一覧 */
.news-list{list-style:none;margin:0;padding:0}
.news-list li{
  display:grid;grid-template-columns:90px 70px 1fr;gap:14px;
  padding:12px 0;border-bottom:1px dashed var(--border);align-items:baseline;font-size:.92rem;
}
.news-list li:last-child{border-bottom:none}
.news-list .date{color:var(--text-muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.news-list .cat{
  font-size:.7rem;padding:2px 6px;border-radius:3px;text-align:center;
  background:var(--tag-bg);color:var(--primary);font-weight:700;
}
.news-list .cat.update{background:#fdecea;color:#c0392b}
body.dark-mode .news-list .cat.update{background:#3a1f1d;color:#ff8a7a}
@media(max-width:520px){.news-list li{grid-template-columns:auto auto;grid-template-rows:auto auto}.news-list .title{grid-column:1/-1}}

/* リンクカテゴリ（カード風・タイル型UI） */
.link-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.link-cat{
  position:relative;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 18px 14px;
  background:linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  overflow:hidden;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.link-cat::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--primary),var(--accent));
}
.link-cat:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px color-mix(in oklab, var(--primary) 45%, transparent);border-color:color-mix(in oklab, var(--primary) 45%, var(--border))}
.link-cat h3{
  font-family:inherit;font-size:1rem;font-weight:700;
  margin:0 0 14px;padding:0 0 10px 6px;
  border-bottom:1px dashed var(--border);
  color:var(--primary);letter-spacing:.02em;
}
.link-cat ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:340px;overflow-y:auto}
.link-cat ul::-webkit-scrollbar{width:6px}
.link-cat ul::-webkit-scrollbar-track{background:transparent}
.link-cat ul::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--primary) 35%,transparent);border-radius:3px}
.link-cat li{
  padding:0;font-size:.9rem;display:block;
}
.link-cat li::before{content:none}
.link-cat li a{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  transition:.18s ease;
  font-weight:500;
}
.link-cat li a::before{
  content:"→";
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:6px;
  background:color-mix(in oklab, var(--primary) 12%, transparent);
  color:var(--primary);font-weight:700;font-size:.85rem;
  flex-shrink:0;
  transition:.18s ease;
}
.link-cat li a:hover{
  background:color-mix(in oklab, var(--primary) 10%, var(--surface));
  border-color:var(--primary);
  color:var(--primary);
  text-decoration:none;
  transform:translateX(3px);
}
.link-cat li a:hover::before{background:var(--primary);color:#fff;transform:translateX(2px)}
body.dark-mode .link-cat li a{background:var(--surface-2)}
body.dark-mode .link-cat li a:hover{background:color-mix(in oklab, var(--primary) 18%, var(--surface-2))}

/* ゲームグリッド — CrazyGames風 */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.game-card{
  position:relative;background:var(--surface-2);border:none;border-radius:14px;
  overflow:hidden;cursor:pointer;transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
  isolation:isolate;
}
.game-card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 28px -10px rgba(0,0,0,.35),0 6px 12px -8px rgba(0,0,0,.25);z-index:2}
.game-card .thumb{aspect-ratio:1/1;background:#0b0f17;overflow:hidden;border-radius:14px;position:relative}
.game-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.game-card:hover .thumb img{transform:scale(1.08)}
.game-card .thumb::after{
  content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.72) 100%);
  opacity:.85;transition:opacity .2s;
}
.game-card:hover .thumb::after{opacity:1;background:linear-gradient(180deg,rgba(124,58,237,.15) 0%,rgba(0,0,0,.85) 100%)}
.game-card .name{
  position:absolute;left:10px;right:10px;bottom:8px;
  font-size:.82rem;font-weight:700;color:#fff;line-height:1.25;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  z-index:1;padding:0;
}
.game-card .play-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
  width:54px;height:54px;border-radius:50%;
  background:rgba(124,58,237,.95);color:#fff;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s, transform .2s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 8px 20px -6px rgba(124,58,237,.7),0 0 0 4px rgba(255,255,255,.15);
  pointer-events:none;z-index:1;
}
.game-card:hover .play-badge{opacity:1;transform:translate(-50%,-50%) scale(1)}
.game-card .play-badge svg{width:22px;height:22px;margin-left:3px;fill:#fff}
.game-card .hot-tag{
  position:absolute;top:8px;left:8px;z-index:1;
  background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;
  font-size:.62rem;font-weight:800;letter-spacing:.5px;
  padding:3px 8px;border-radius:6px;text-transform:uppercase;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
@media(max-width:600px){.game-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.game-card .name{font-size:.76rem}}

/* サイドバーウィジェット */
.widget{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:20px}
.widget-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px}
.widget-head::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
.widget-body{padding:14px 16px;font-size:.88rem}
.widget-body ul{list-style:none;margin:0;padding:0}
.widget-body li{padding:6px 0;border-bottom:1px dashed var(--border)}
.widget-body li:last-child{border-bottom:none}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:.88rem}
/* 今日の日付 ＋ おみくじ（サイト情報ウィジェット） */
.site-today{font-weight:700;font-size:.92rem;color:var(--primary);padding:6px 0;margin-bottom:4px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.site-omikuji-box{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);text-align:center}
.site-omikuji-btn{display:inline-block;font:inherit;font-weight:700;font-size:.85rem;color:var(--primary);background:var(--surface-2);border:1px solid var(--primary);border-radius:999px;padding:7px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s,color .2s}
.site-omikuji-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px color-mix(in oklab, var(--primary) 35%, transparent);background:var(--primary);color:#fff}
.site-omikuji-btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;background:var(--surface-2);color:var(--muted-foreground,#6b7280);border-color:var(--border)}
.site-omikuji-result{margin-top:10px;min-height:1em;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.site-omikuji-result.show{opacity:1;transform:translateY(0)}
.site-omikuji-rank{display:block;font-size:1.5rem;font-weight:700;letter-spacing:.2em;text-indent:.2em;color:var(--primary)}
.site-omikuji-rank.daikichi{color:#c8a514}
.site-omikuji-rank.kyo{color:#b3261e}
.site-omikuji-msg{display:block;margin-top:4px;font-size:.8rem;color:var(--muted-foreground,#6b7280)}
.stat-row:last-child{border-bottom:none}
.stat-row span:last-child{color:var(--primary);font-weight:700;font-variant-numeric:tabular-nums}

/* 設定ページ */
.setting-row{padding:16px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row label{display:block;font-weight:500;margin-bottom:8px;font-size:.95rem}
.setting-row .desc{font-size:.82rem;color:var(--text-muted);margin-bottom:10px}
select,input[type=range],input[type=color]{
  font-family:inherit;font-size:.9rem;
  background:var(--surface-2);color:var(--text);
  border:1px solid var(--border);border-radius:4px;padding:7px 10px;outline:none;
}
input[type=range]{padding:0;height:6px;width:200px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer}
input[type=color]{padding:2px;width:46px;height:36px;cursor:pointer}

.btn{
  display:inline-block;background:var(--primary);color:#fff;border:none;
  padding:8px 18px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:500;
}
.btn:hover{background:var(--primary-hover);text-decoration:none;color:#fff}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.ghost:hover{background:var(--primary);color:#fff}

/* フッター */
footer{background:var(--surface);border-top:1px solid var(--border);margin-top:40px}
.footer-inner{max-width:1180px;margin:0 auto;padding:30px 20px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
.footer-inner h4{font-size:.85rem;margin:0 0 10px;color:var(--text);font-family:'Noto Sans JP','Noto Color Emoji',sans-serif}
.footer-inner ul{list-style:none;margin:0;padding:0;font-size:.82rem}
.footer-inner li{padding:3px 0}
.footer-inner a{color:var(--text-muted)}
.footer-copy{border-top:1px solid var(--border);padding:14px 20px;text-align:center;font-size:.78rem;color:var(--text-muted)}
@media(max-width:700px){.footer-inner{grid-template-columns:1fr 1fr}}

/* ゲーム中は装飾アニメを停止して描画負荷を下げる */
body.gaming .ticker-move,body.gaming .live-badge::before,body.gaming .notif-btn .notif-ico{animation:none!important}
body.gaming #bg-image-layer,body.gaming .pixel-clock{will-change:auto}
body.gaming main,body.gaming footer,body.gaming .site-header{content-visibility:auto}

/* ゲームモーダル（情報サイト風に控えめに） */
#game-modal{display:none;position:fixed;inset:0;background:rgba(8,10,16,.94);backdrop-filter:blur(10px);z-index:1000;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:0}
.gm-shell{width:100%;max-width:1180px;height:min(88vh,900px);background:#0f1420;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
.gm-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#1a2030,#141926);border-bottom:1px solid rgba(255,255,255,.06)}
#game-modal.fs-active .gm-bar{display:none}
.gm-title{flex:1;min-width:0;color:#fff;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.gm-title .gm-logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.gm-title .gm-logo svg{width:14px;height:14px;fill:#fff}
.gm-actions{display:flex;gap:6px;align-items:center}
.gm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#e5e7eb;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600;transition:background .15s,transform .15s,color .15s}
.gm-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.gm-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gm-btn.gm-primary{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:transparent;color:#fff;padding:0 14px}
.gm-btn.gm-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(124,58,237,.7)}
.gm-btn.gm-close{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.25)}
.gm-btn.gm-close:hover{background:#dc2626;color:#fff}
.gm-body{flex:1;position:relative;background:#000;display:flex;contain:layout paint size}
.gm-body iframe{flex:1;width:100%;height:100%;border:0;display:block;background:#000}
#game-modal:fullscreen,.gm-shell:fullscreen{width:100vw;height:100vh;max-width:none;border-radius:0;padding:0}
.gm-fps{
  position:absolute;top:10px;left:10px;z-index:5;pointer-events:none;
  font-family:'Press Start 2P','Courier New',monospace;font-size:.62rem;line-height:1.6;
  color:#7CFC00;background:rgba(0,0,0,.55);border:1px solid rgba(124,252,0,.35);
  border-radius:8px;padding:6px 9px;letter-spacing:1px;font-variant-numeric:tabular-nums;
  text-shadow:0 0 6px rgba(124,252,0,.55);white-space:pre;
}
.gm-fps.warn{color:#fbbf24;border-color:rgba(251,191,36,.4);text-shadow:0 0 6px rgba(251,191,36,.5)}
.gm-fps.bad{color:#f87171;border-color:rgba(248,113,113,.4);text-shadow:0 0 6px rgba(248,113,113,.5)}
.gm-fps.hidden{display:none}
@media(max-width:640px){
  #game-modal{padding:0}
  .gm-shell{height:100vh;max-width:100%;border-radius:0}
  .gm-btn .gm-lbl{display:none}
  .gm-btn{padding:0;width:36px}
  .gm-btn.gm-primary{padding:0;width:36px}
}
/* News modal */

.nm-desc{font-size:.94rem;line-height:1.75;color:var(--text);margin:0 20px 18px;white-space:pre-wrap}

}

/* ───── 天気ページ ───── */
.wx-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}

.wx-alert{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);margin-bottom:16px}

.wx-alert .txt p{margin:0;color:var(--text-muted);font-size:.84rem;line-height:1.6}

/* ===== 位置情報の許可ダイアログ ===== */
.geo-ov{position:fixed;inset:0;background:rgba(8,12,20,.62);backdrop-filter:blur(3px);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}

&lt;style&gt;
/* ============================================================
   全デバイス対応の調整（後から追記した上書きスタイル）
   - SVGアイコンがタブレットで小さくなりすぎる問題の修正
   - タッチ端末でもホバー系アニメーションが見えるように
   ============================================================ */

/* ── SVGアイコンを画面幅に応じてスケール ── */
.game-card .play-badge{width:clamp(54px,8vw,74px);height:clamp(54px,8vw,74px)}
.game-card .play-badge svg{width:clamp(24px,3.4vw,32px);height:clamp(24px,3.4vw,32px)}
.gm-title .gm-logo{width:clamp(28px,3.4vw,36px);height:clamp(28px,3.4vw,36px)}
.gm-title .gm-logo svg{width:clamp(16px,2.2vw,22px);height:clamp(16px,2.2vw,22px)}
.gm-btn{height:clamp(38px,4.6vw,46px);min-width:clamp(38px,4.6vw,46px)}
.gm-btn svg{width:clamp(18px,2.4vw,24px);height:clamp(18px,2.4vw,24px)}
.icon-btn{width:clamp(38px,4.6vw,44px);height:clamp(38px,4.6vw,44px);font-size:clamp(1rem,1.8vw,1.15rem)}
.icon-btn svg,.notif-btn svg,.notif-btn .notif-ico,.theme-icon{
  width:clamp(22px,2.8vw,28px);height:clamp(22px,2.8vw,28px)
}

/* ── タブレット帯（601〜1024px）でアイコンが潰れないよう下限を確保 ── */
@media (min-width:601px) and (max-width:1024px){
  .icon-btn{width:44px;height:44px}
  .icon-btn svg,.notif-btn svg,.notif-btn .notif-ico,.theme-icon{width:26px;height:26px}
  .gm-btn{height:44px;min-width:44px}
  .gm-btn svg{width:22px;height:22px}
  .gm-title .gm-logo{width:34px;height:34px}
  .gm-title .gm-logo svg{width:20px;height:20px}
  .game-card .play-badge{width:66px;height:66px}
  .game-card .play-badge svg{width:30px;height:30px}
  .game-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}

/* ── ヒーローの装飾アニメーションを全デバイスで表示 ── */
#home-page .home-hero-deco{
  display:block !important;
  animation:decoFloat 9s ease-in-out infinite;
}
@keyframes decoFloat{
  0%,100%{transform:translateY(0) rotate(0deg);opacity:.9}
  50%{transform:translateY(-8px) rotate(1.5deg);opacity:1}
}
@media(max-width:820px){
  #home-page .home-hero-deco{min-height:96px}
}
@media(max-width:600px){
  #home-page .home-hero-deco{min-height:72px}
}

/* ── タッチ端末（ホバー不可）でもアニメーションが見える ── */
@keyframes playPulseTouch{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.9}
  50%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
}
@keyframes kenburnsTouch{
  0%{transform:scale(1)}
  100%{transform:scale(1.07)}
}
@media (hover:none),(pointer:coarse){
  .game-card .play-badge{
    opacity:.92;
    transform:translate(-50%,-50%) scale(1);
    animation:playPulseTouch 2.4s ease-in-out infinite;
  }
  .cg-hero-card img{animation:kenburnsTouch 12s ease-in-out infinite alternate}
  .game-card:active .thumb img{transform:scale(1.08)}
  .cg-hero-card:active{transform:translateY(-3px)}
}

/* ── ティッカーはモバイルでも十分な速さで流す ── */
@media(max-width:820px){
  .ticker-move{animation-duration:40s}
}
&lt;/style&gt;

/* イベント表示 */
.ao-banner{position:relative;display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:0;align-items:stretch;margin-bottom:24px;overflow:hidden;border:1px solid color-mix(in oklab,#67e8f9 34%,transparent);border-radius:18px;background:linear-gradient(120deg,#080c21 0%,#101b4b 52%,#092f39 100%);color:#f8fafc;box-shadow:0 22px 54px -30px rgba(5,15,45,.9);isolation:isolate}
.ao-banner::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(103,232,249,.09) 70%,rgba(52,211,153,.12));pointer-events:none;z-index:1}
.ao-banner-media{position:relative;min-height:190px;overflow:hidden}
.ao-banner-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 45%,#101b4b 100%)}
.ao-banner img{width:100%;height:100%;min-height:190px;object-fit:cover;display:block;image-rendering:pixelated;transform:scale(1.03);transition:transform .45s ease}
.ao-banner:hover img{transform:scale(1.08)}
.ao-content{position:relative;z-index:2;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.ao-banner .tag,.ao-card .tag{display:inline-flex;align-items:center;gap:7px;font-size:.68rem;font-weight:800;letter-spacing:.12em;background:rgba(225,29,72,.18);color:#fecdd3;border:1px solid rgba(251,113,133,.5);padding:5px 10px;border-radius:99px}
.ao-banner .tag::before,.ao-card .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#fb7185;box-shadow:0 0 0 4px rgba(251,113,133,.15);animation:aoPulse 1.8s infinite}
.ao-banner h2{margin:10px 0 5px;font-size:clamp(1.45rem,3vw,2rem);letter-spacing:.02em;color:#f8fafc;text-shadow:0 0 22px rgba(129,140,248,.55)}
.ao-kicker{margin:0 0 9px;color:#67e8f9;font-size:.72rem;font-weight:800;letter-spacing:.16em}
.ao-banner p{margin:0 0 14px;color:#cbd5e1;font-size:.92rem;line-height:1.7}
.ao-meta{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 17px;padding:0;list-style:none}
.ao-meta li{padding:5px 9px;border:1px solid rgba(148,163,184,.24);border-radius:7px;background:rgba(15,23,42,.48);color:#dbeafe;font-size:.72rem;font-weight:700}
.ao-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,#22d3ee,#34d399);color:#06232b!important;font-weight:900;padding:10px 19px;border-radius:8px;text-decoration:none;box-shadow:0 10px 28px -12px rgba(34,211,238,.8);transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
.ao-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 14px 30px -11px rgba(52,211,153,.85);text-decoration:none}
.ao-modal{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,5,18,.84);backdrop-filter:blur(9px);animation:aoFade .3s}
.ao-card{position:relative;width:min(92vw,460px);text-align:center;padding:28px;border-radius:18px;color:#f8fafc;background:linear-gradient(145deg,#101b4b,#080c21 65%,#092f39);border:1px solid rgba(103,232,249,.38);box-shadow:0 32px 80px -20px #020617,0 0 44px rgba(34,211,238,.14);animation:aoPop .45s cubic-bezier(.2,1.2,.4,1)}
.ao-card img{width:100%;aspect-ratio:92/48;object-fit:cover;border-radius:12px;margin:16px 0;border:1px solid rgba(103,232,249,.35)}
.ao-card h2{margin:9px 0 4px;font-size:1.8rem;letter-spacing:.03em;color:#f8fafc;text-shadow:0 0 18px rgba(129,140,248,.65)}
.ao-card p{color:#cbd5e1;line-height:1.7}
.ao-close{position:absolute;top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.25);border-radius:50%;color:#e2e8f0;font-size:1.25rem;line-height:1;cursor:pointer}
.ao-skip{display:block;margin:13px auto 0;padding:6px 10px;background:none;border:0;color:#94a3b8;cursor:pointer;font-size:.82rem}
@keyframes aoPop{from{transform:translateY(18px) scale(.96);opacity:0}}@keyframes aoFade{from{opacity:0}}@keyframes aoPulse{50%{opacity:.4}}
@media(max-width:650px){.ao-banner{grid-template-columns:1fr}.ao-banner-media{min-height:145px;max-height:180px}.ao-banner-media::after{background:linear-gradient(180deg,transparent 35%,#101b4b 100%)}.ao-content{padding:20px}.ao-banner img{min-height:145px}.ao-meta{margin-bottom:15px}}
@media(prefers-reduced-motion:reduce){.ao-banner img,.ao-btn{transition:none}.ao-banner .tag::before,.ao-card .tag::before{animation:none}}

&lt;style&gt;
/* Calendar refresh — isolated to the calendar page */
#calendar-page { --cal-soft:color-mix(in oklab,var(--primary) 7%,var(--surface)); --cal-line:color-mix(in oklab,var(--primary) 16%,var(--border)); --cal-warm:#dd8b3b; }
#calendar-page .calendar-intro { margin:0 0 20px; padding:22px 26px; border:1px solid var(--cal-line); border-radius:8px; background:linear-gradient(120deg,var(--cal-soft),var(--surface)); }
#calendar-page .calendar-intro .calendar-eyebrow { margin:0 0 3px; color:var(--primary);font-weight:800;font-size:.74rem; }
#calendar-page .calendar-intro h1 { margin:0;font-size:1.7rem; }
#calendar-page .calendar-intro p:last-child { margin:5px 0 0;color:var(--text-muted);font-size:.87rem; }
#calendar-page .calendar-layout {display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.82fr);gap:18px;align-items:start}
#calendar-page .calendar-main {padding:20px;min-width:0}
#calendar-page .calendar-toolbar {display:flex;align-items:center;gap:8px;margin-bottom:16px}
#calendar-page .calendar-toolbar h2 {margin:0 auto 0 0;font-family:'Noto Serif JP',serif;font-size:1.35rem;white-space:nowrap}
#calendar-page .calendar-toolbar button,#calendar-page .calendar-form button,#calendar-page .calendar-actions button {display:inline-flex;align-items:center;justify-content:center;min-height:38px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
#calendar-page button:hover {border-color:var(--primary)}
#calendar-page button:focus-visible,#calendar-page input:focus-visible,#calendar-page select:focus-visible {outline:2px solid var(--primary);outline-offset:2px}
#calendar-page .calendar-toolbar button {min-width:38px;padding:0 10px}
#calendar-page .calendar-toolbar .calendar-today,#calendar-page .calendar-form button[type=submit] {background:var(--primary);border-color:var(--primary);color:var(--surface)}
#calendar-page .calendar-summary {font-size:.78rem;color:var(--text-muted);margin:-5px 0 14px}
#calendar-page .calendar-week,#calendar-page .calendar-grid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
#calendar-page .calendar-week span {text-align:center;padding:8px 0;color:var(--text-muted);font-size:.78rem;font-weight:700}
#calendar-page .calendar-week span:first-child,#calendar-page .calendar-day:nth-child(7n+1) .calendar-num {color:var(--accent)}
#calendar-page .calendar-week span:last-child,#calendar-page .calendar-day:nth-child(7n) .calendar-num {color:var(--primary)}
#calendar-page .calendar-day {position:relative;display:flex;flex-direction:column;gap:4px;min-height:91px;min-width:0;padding:8px;border:1px solid var(--border);margin:-1px 0 0 -1px;background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;overflow:hidden}
#calendar-page .calendar-day:hover {z-index:1;background:var(--cal-soft)}
#calendar-page .calendar-day.outside {color:var(--text-muted);background:var(--surface-2);opacity:.62}
#calendar-page .calendar-day.selected {z-index:2;border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--cal-soft)}
#calendar-page .calendar-day.today .calendar-num {display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--primary);color:var(--surface)}
#calendar-page .calendar-num {display:grid;place-items:center;width:27px;height:27px;font-weight:800;font-size:.85rem}
#calendar-page .calendar-preview {display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:2px 5px;border-radius:3px;background:var(--cal-soft);color:var(--primary);font-size:.7rem;line-height:1.45}
#calendar-page .calendar-preview.personal {background:color-mix(in oklab,var(--cal-warm) 15%,var(--surface));color:var(--text)}
#calendar-page .calendar-more {font-size:.66rem;color:var(--text-muted)}
#calendar-page .calendar-agenda .section-head {display:flex;align-items:center;justify-content:space-between;gap:8px}
#calendar-page .calendar-agenda .section-head h2 {font-size:1rem}
#calendar-page .calendar-agenda .section-body {padding:18px}
#calendar-page .calendar-form {display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:9px}
#calendar-page .calendar-form input,#calendar-page .calendar-form select,#calendar-page .calendar-search {min-width:0;width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font:inherit;font-size:.85rem}
#calendar-page .calendar-form #calendarMemo {grid-column:1/-1}
#calendar-page .calendar-form .calendar-form-actions {grid-column:1/-1;display:flex;gap:8px}

#calendar-page .calendar-item {display:flex;align-items:center;gap:9px;min-width:0;padding:10px 11px;border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:5px;background:var(--surface-2)}
#calendar-page .calendar-item.news {border-left-color:var(--cal-warm)}
#calendar-page .calendar-item.done {opacity:.58}
#calendar-page .calendar-item.done .calendar-item-title {text-decoration:line-through}
#calendar-page .calendar-item-content {min-width:0;flex:1;overflow-wrap:anywhere}
#calendar-page .calendar-item-title {font-weight:700;font-size:.84rem;line-height:1.5}
#calendar-page .calendar-item-meta {display:block;color:var(--text-muted);font-size:.7rem}
#calendar-page .calendar-item button {flex:0 0 auto;display:grid;place-items:center;width:29px;height:29px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text-muted);font-size:.92rem;cursor:pointer}
#calendar-page .calendar-item button:hover {background:var(--cal-soft);color:var(--primary)}
#calendar-page .calendar-empty {padding:22px 4px;color:var(--text-muted);text-align:center;font-size:.85rem}
#calendar-page .calendar-side {min-width:0}
#calendar-page .calendar-actions {display:flex;gap:7px;flex-wrap:wrap}
#calendar-page .calendar-actions button {padding:0 10px;font-size:.74rem}
#calendar-page .calendar-upcoming {display:grid;gap:0;margin-top:12px}
#calendar-page .calendar-upcoming button {display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);text-align:left;cursor:pointer;font:inherit}
#calendar-page .calendar-upcoming button:hover {color:var(--primary)}
#calendar-page .upcoming-date {flex:0 0 44px;text-align:center;color:var(--primary);font-size:.7rem;font-weight:800;line-height:1.3}
#calendar-page .upcoming-date strong {display:block;font-size:1.25rem}
#calendar-page .upcoming-title {min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.82rem;font-weight:700}
#calendar-page .calendar-search {margin-top:12px}
@media(max-width:850px){#calendar-page .calendar-layout {grid-template-columns:1fr}#calendar-page .calendar-side {display:contents}}
@media(max-width:550px){#calendar-page .calendar-intro {padding:17px}#calendar-page .calendar-main {padding:12px}#calendar-page .calendar-toolbar {flex-wrap:wrap}#calendar-page .calendar-toolbar h2 {width:100%;font-size:1.2rem}#calendar-page .calendar-day {min-height:67px;padding:4px;gap:2px}#calendar-page .calendar-num {width:25px;height:25px}#calendar-page .calendar-preview {font-size:.61rem;padding:1px 2px}#calendar-page .calendar-more {font-size:.6rem}}
@media(prefers-reduced-motion:reduce){#calendar-page button {transition:none}}

            &lt;div class="setting-group"&gt;
                &lt;label&gt;動画 API (Invidious) ノード:&lt;/label&gt;
                &lt;input type="text" id="settingOmadaApi" class="setting-input" value="https://yt.omada.cafe"&gt;
            &lt;/div&gt;

            &lt;div class="setting-group"&gt;
                &lt;label&gt;楽天市場 アプリID (Rakuten AppID):&lt;/label&gt;
                &lt;input type="text" id="settingRakutenAppId" class="setting-input" value="1018224734614210871"&gt;
            &lt;/div&gt;

            &lt;button class="save-btn" onclick="sxSaveSettings()"&gt;設定を保存&lt;/button&gt;
        &lt;/div&gt;
    &lt;/div&gt;

        &lt;/div&gt;
        &lt;script&gt;
(function(){

        let SERPAPI_KEYS_WEB = [];
        let SERPAPI_KEYS_IMAGE = [];

        const searchCache = new Map();

        let currentWebKeyIdx = 0;
        let currentImageKeyIdx = 0;
        let currentQuery = '';
        let currentPage = 1;
        let currentCategory = 'general';
        let isLoading = false;
        let hasMoreResults = true;
        let seenItemsSet = new Set();
        let inputDebounceTimer = null;

        let currentImagesData = [];
        let activeImageIndex = 0;

        (function init() {
            loadSettings();
            window.addEventListener('scroll', handleAutoScroll, { passive: true });
        })();

        function parseKeysFromInput(text) {
            if (!text) return [];
            return text.split(/[\n,]/).map(k =&gt; k.trim()).filter(k =&gt; k.length &gt; 0);
        }

        function loadSettings() {
            const savedTheme = localStorage.getItem('nkys_search_theme') || 'light';
            document.getElementById('search-app').setAttribute('data-theme', savedTheme);
            document.getElementById('settingTheme').value = savedTheme;

            if (localStorage.getItem('settingDeduplicate') !== null) {
                document.getElementById('settingDeduplicate').value = localStorage.getItem('settingDeduplicate');
            }
            if (localStorage.getItem('settingOmadaApi')) {
                document.getElementById('settingOmadaApi').value = localStorage.getItem('settingOmadaApi');
            }
            if (localStorage.getItem('settingRakutenAppId')) {
                document.getElementById('settingRakutenAppId').value = localStorage.getItem('settingRakutenAppId');
            }

            const rawWebKeys = localStorage.getItem('settingSerpKeysWeb') || '';
            const rawImgKeys = localStorage.getItem('settingSerpKeysImage') || '';
            document.getElementById('settingSerpKeysWeb').value = rawWebKeys;
            document.getElementById('settingSerpKeysImage').value = rawImgKeys;

            SERPAPI_KEYS_WEB = parseKeysFromInput(rawWebKeys);
            SERPAPI_KEYS_IMAGE = parseKeysFromInput(rawImgKeys);
        }

        function sxSaveSettings() {
            const theme = document.getElementById('settingTheme').value;
            localStorage.setItem('nkys_search_theme', theme);
            document.getElementById('search-app').setAttribute('data-theme', theme);

            localStorage.setItem('settingDeduplicate', document.getElementById('settingDeduplicate').value);
            localStorage.setItem('settingOmadaApi', document.getElementById('settingOmadaApi').value);
            localStorage.setItem('settingRakutenAppId', document.getElementById('settingRakutenAppId').value);

            const webKeysVal = document.getElementById('settingSerpKeysWeb').value;
            const imgKeysVal = document.getElementById('settingSerpKeysImage').value;
            localStorage.setItem('settingSerpKeysWeb', webKeysVal);
            localStorage.setItem('settingSerpKeysImage', imgKeysVal);

            SERPAPI_KEYS_WEB = parseKeysFromInput(webKeysVal);
            SERPAPI_KEYS_IMAGE = parseKeysFromInput(imgKeysVal);

            closeSettings();
        }

        function onInputSearch() {
            const input = document.getElementById('sxSearchInput').value;
            document.getElementById('clearBtn').style.display = input ? 'flex' : 'none';

            clearTimeout(inputDebounceTimer);
            if (!input.trim()) {
                document.getElementById('autocompleteDropdown').style.display = 'none';
                return;
            }

            inputDebounceTimer = setTimeout(async () =&gt; {
                try{ window.__sugCtrl &amp;&amp; window.__sugCtrl.abort(); }catch(_){}
                const ctrl = (window.__sugCtrl = new AbortController());
                const sigAbort = ctrl.signal;
                const escapeHtml = (t) =&gt; t.replace(/[&amp;&lt;&gt;"']/g, c =&gt; ({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','"':'&amp;quot;',"'":'&amp;#39;'}[c]));
                let suggestions = [];
                const jobs = [];
                jobs.push((async () =&gt; {
                    try {
                        const wRes = await fetch(`https://ja.wikipedia.org/w/api.php?action=opensearch&amp;format=json&amp;origin=*&amp;limit=8&amp;search=${encodeURIComponent(input)}`, { signal: sigAbort });
                        if (wRes.ok) {
                            const wData = await wRes.json();
                            if (Array.isArray(wData?.[1])) return wData[1];
                        }
                    } catch(e) {}
                    return [];
                })());
                jobs.push((async () =&gt; {
                    try {
                        const dRes = await fetch(`https://api.duckduckgo.com/ac/?q=${encodeURIComponent(input)}&amp;type=list`, { signal: sigAbort });
                        if (dRes.ok) {
                            const dData = await dRes.json();
                            if (Array.isArray(dData?.[1])) return dData[1];
                        }
                    } catch(e) {}
                    return [];
                })());
                const lists = await Promise.all(jobs);
                if(sigAbort.aborted) return;
                suggestions = [...new Set(lists.flat())];
                if (suggestions.length &gt; 0) {
                    const dropdown = document.getElementById('autocompleteDropdown');
                    dropdown.innerHTML = suggestions.slice(0, 8).map(t =&gt;
                        `&lt;div class="autocomplete-item" onclick="selectSuggest(decodeURIComponent('${encodeURIComponent(t)}'))"&gt;` +
                        `&lt;svg class="autocomplete-ic" viewBox="0 0 24 24" aria-hidden="true"&gt;&lt;circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/&gt;&lt;path d="m20 20-3.8-3.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/&gt;&lt;/svg&gt;` +
                        `&lt;span&gt;${escapeHtml(t)}&lt;/span&gt;&lt;/div&gt;`
                    ).join('');
                    dropdown.style.display = 'block';
                    return;
                }
                document.getElementById('autocompleteDropdown').style.display = 'none';
            }, 260);
        }

        function selectSuggest(text) {
            document.getElementById('sxSearchInput').value = text;
            document.getElementById('autocompleteDropdown').style.display = 'none';
            handleSearch();
        }

        function clearSearch() {
            document.getElementById('sxSearchInput').value = '';
            document.getElementById('clearBtn').style.display = 'none';
            document.getElementById('autocompleteDropdown').style.display = 'none';
        }

        function openAbout() { document.getElementById('aboutModal').style.display = 'flex'; }
        function closeAbout() { document.getElementById('aboutModal').style.display = 'none'; }
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function deduplicateResults(items) {
            const isDeduplicateEnabled = document.getElementById('settingDeduplicate').value === 'true';
            if (!isDeduplicateEnabled || !Array.isArray(items)) return items;

            return items.filter(item =&gt; {
                const key = item.url || item.img_src || item.videoId || item.previewUrl;
                if (!key) return true;
                if (seenItemsSet.has(key)) return false;
                seenItemsSet.add(key);
                return true;
            });
        }

        function showGhostScreen(type, isNextPage = false) {
            if (isNextPage) return;
            const resultsDiv = document.getElementById('results');
            const sidebar = document.getElementById('sidebar');

            let ghostHtml = '';
            if (type === 'images') {
                ghostHtml = `&lt;div class="image-grid"&gt;` + '&lt;div class="ghost-pulse ghost-grid-card"&gt;&lt;/div&gt;'.repeat(8) + `&lt;/div&gt;`;
            } else if (['shopping', 'music'].includes(type)) {
                ghostHtml = `&lt;div class="${type}-grid"&gt;` + '&lt;div class="ghost-pulse ghost-grid-card"&gt;&lt;/div&gt;'.repeat(8) + `&lt;/div&gt;`;
            } else {
                ghostHtml = '&lt;div class="ghost-pulse ghost-item"&gt;&lt;/div&gt;'.repeat(5);
            }
            resultsDiv.innerHTML = ghostHtml;

            if (type === 'videos' || type === 'general' || type === 'news') {
                sidebar.innerHTML = '&lt;div class="ghost-pulse ghost-sidebar-card"&gt;&lt;/div&gt;&lt;div class="ghost-pulse ghost-sidebar-card"&gt;&lt;/div&gt;';
                sidebar.classList.add('active');
            } else {
                sidebar.classList.remove('active');
            }
        }

        function handleSearch(e) {
            if(e) e.preventDefault();
            const q = document.getElementById('sxSearchInput').value.trim();
            if(!q) return;

            currentQuery = q;
            currentPage = 1;
            hasMoreResults = true;
            seenItemsSet.clear();
            currentImagesData = [];

            document.getElementById('autocompleteDropdown').style.display = 'none';
            document.getElementById('mainContainer').classList.add('results-mode');

            showGhostScreen(currentCategory);
            executeSearch();

            if (currentCategory === 'news' || currentCategory === 'general') {
                setTimeout(() =&gt; fetchWikipediaKnowledgePanel(currentQuery), 10);
            }
        }

        function changeCategory(cat, evt) {
            if(isLoading || currentCategory === cat) return;
            document.querySelectorAll('.tab').forEach(t =&gt; t.classList.remove('active'));
            evt.currentTarget.classList.add('active');

            currentCategory = cat;
            currentPage = 1;
            hasMoreResults = true;
            seenItemsSet.clear();
            currentImagesData = [];

            showGhostScreen(currentCategory);

            if(currentQuery) {
                executeSearch();
                if (currentCategory === 'news' || currentCategory === 'general') {
                    setTimeout(() =&gt; fetchWikipediaKnowledgePanel(currentQuery), 10);
                }
            }
        }

        async function executeSearch(isNextPage = false) {
            const cacheKey = `${currentCategory}:${currentQuery}:${currentPage}`;

            if (searchCache.has(cacheKey)) {
                const cachedData = searchCache.get(cacheKey);
                renderResults(deduplicateResults(cachedData), isNextPage, currentCategory);
                if (currentCategory === 'videos' &amp;&amp; !isNextPage) {
                    fetchSideShorts(currentQuery);
                }
                return;
            }

            isLoading = true;
            if (isNextPage) {
                document.getElementById('infiniteLoader').style.display = 'block';
            }

            let rawResults = [];

            if (currentCategory === 'shopping') {
                rawResults = await fetchRakutenShoppingAPI(currentQuery, currentPage);
            } else if (currentCategory === 'music') {
                rawResults = await fetchITunesMusicAPI(currentQuery);
            } else if (currentCategory === 'images') {
                rawResults = await fetchImageSearch(currentQuery, currentPage);
            } else if (currentCategory === 'news') {
                rawResults = await fetchNewsMultiAPI(currentQuery, currentPage);
            } else if (currentCategory === 'videos') {
                rawResults = await fetchOmadaMedia(currentQuery, currentPage);
            } else {
                rawResults = await fetchFastSerpApiSearch(currentQuery, currentPage);
            }

            if (rawResults.length &gt; 0) {
                searchCache.set(cacheKey, rawResults);
            }

            const results = deduplicateResults(rawResults);

            isLoading = false;
            document.getElementById('infiniteLoader').style.display = 'none';
            renderResults(results, isNextPage, currentCategory);

            if (currentCategory === 'videos' &amp;&amp; !isNextPage) {
                fetchSideShorts(currentQuery);
            }
        }

        async function fetchTextWithProxy(targetUrl) {
            const proxyProviders = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            for (const pUrl of proxyProviders) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() =&gt; controller.abort(), 4500);
                    const res = await fetch(pUrl, { signal: controller.signal });
                    clearTimeout(timer);

                    if (res.ok) {
                        const text = await res.text();
                        if (text &amp;&amp; !text.includes("403 Forbidden")) return text;
                    }
                } catch (e) {}
            }
            return null;
        }

        /* SearXNG (search.lumy.live) 検索API */
        async function fetchSearxngWeb(query, page = 1) {
            const targetUrl = `https://search.lumy.live/search?q=${encodeURIComponent(query)}&amp;format=json&amp;pageno=${page}`;

            try {
                const res = await fetch(targetUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (data.results &amp;&amp; data.results.length &gt; 0) {
                        return data.results.map(item =&gt; ({
                            title: item.title,
                            url: item.url,
                            content: item.content || ''
                        }));
                    }
                }
            } catch (e) {}

            const rawText = await fetchTextWithProxy(targetUrl);
            if (rawText) {
                try {
                    const data = JSON.parse(rawText);
                    if (data.results &amp;&amp; data.results.length &gt; 0) {
                        return data.results.map(item =&gt; ({
                            title: item.title,
                            url: item.url,
                            content: item.content || ''
                        }));
                    }
                } catch (e) {}
            }

            return [];
        }

        async function fetchSearxngImages(query, page = 1) {
            const targetUrl = `https://search.lumy.live/search?q=${encodeURIComponent(query)}&amp;categories=images&amp;format=json&amp;pageno=${page}`;

            try {
                const res = await fetch(targetUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (data.results &amp;&amp; data.results.length &gt; 0) {
                        return data.results.map(item =&gt; ({
                            title: item.title || query,
                            url: item.url || item.img_src,
                            img_src: item.img_src || item.thumbnail_src,
                            source_name: item.engine || ''
                        }));
                    }
                }
            } catch (e) {}

            const rawText = await fetchTextWithProxy(targetUrl);
            if (rawText) {
                try {
                    const data = JSON.parse(rawText);
                    if (data.results &amp;&amp; data.results.length &gt; 0) {
                        return data.results.map(item =&gt; ({
                            title: item.title || query,
                            url: item.url || item.img_src,
                            img_src: item.img_src || item.thumbnail_src,
                            source_name: item.engine || ''
                        }));
                    }
                } catch (e) {}
            }

            return [];
        }

        async function fetchFastSerpApiSearch(query, page = 1) {
  const results = [];
  try {
    const r = await fetch(`https://visual-query-pal.lovable.app/api/search?q=${encodeURIComponent(query)}`, {cache:'no-store'});
    if (r.ok) {
      const d = await r.json();
      if (Array.isArray(d?.results)) {
        d.results.forEach(x =&gt; { if (x?.url) results.push({ title: x.title || query, url: x.url, content: x.snippet || '' }); });
      }
    }
  } catch(_) {}
  const wiki = await fetchWikipediaSearch(query);
  const seen = new Set(results.map(x =&gt; x.url));
  wiki.forEach(x =&gt; { if (!seen.has(x.url)) results.push(x); });
  return results;
}
async function fetchImageSearch(query, page = 1) {
  const results = [];
  try {
    const r = await fetch(`https://visual-query-pal.lovable.app/api/image/search?q=${encodeURIComponent(query)}`, {cache:'no-store'});
    if (r.ok) {
      const d = await r.json();
      if (Array.isArray(d?.results)) {
        d.results.forEach(x =&gt; {
          const img = x?.thumbnail || x?.image;
          if (img) results.push({ title: x.title || query, url: x.url || x.image, img_src: img, source_name: x.source || 'Web' });
        });
      }
    }
  } catch(_) {}
  try {
    const u=`https://commons.wikimedia.org/w/api.php?action=query&amp;generator=search&amp;gsrsearch=${encodeURIComponent(query)}&amp;gsrnamespace=6&amp;gsrlimit=24&amp;prop=imageinfo&amp;iiprop=url|mime&amp;iiurlwidth=640&amp;format=json&amp;origin=*`;
    const r=await fetch(u,{cache:'no-store'});
    const d=r.ok?await r.json():null;
    const wikiImgs=Object.values(d?.query?.pages||{}).map(p=&gt;({title:(p.title||'').replace(/^File:/,''),url:p.imageinfo?.[0]?.descriptionurl||p.imageinfo?.[0]?.url,img_src:p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url,source_name:'Wikimedia Commons'})).filter(x=&gt;x.img_src);
    const seen=new Set(results.map(x=&gt;x.img_src));
    wikiImgs.forEach(x=&gt;{ if(!seen.has(x.img_src)) results.push(x); });
  } catch(_) {}
  if (results.length) return results;
  return await fetchWikipediaImageFallback(query);
}
async function fetchWikipediaImageFallback(query) {
            try {
                const res = await fetch(`https://ja.wikipedia.org/w/api.php?action=query&amp;generator=search&amp;gsrsearch=${encodeURIComponent(query)}&amp;gsrlimit=18&amp;prop=pageimages&amp;pithumbsize=600&amp;format=json&amp;origin=*`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.query?.pages) {
                        return Object.values(data.query.pages)
                            .filter(p =&gt; p.thumbnail?.source)
                            .map(p =&gt; ({
                                title: p.title,
                                url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(p.title)}`,
                                img_src: p.thumbnail.source,
                                source_name: 'Wikipedia'
                            }));
                    }
                }
            } catch(e) {}
            return [];
        }

        async function fetchNewsMultiAPI(query, page) {
            let results = [];
            try {
                const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&amp;hl=ja&amp;gl=JP&amp;ceid=JP:ja`;
                const xmlText = await fetchTextWithProxy(rssUrl);

                if (xmlText) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                    const items = xmlDoc.querySelectorAll('item');

                    items.forEach(item =&gt; {
                        const title = item.querySelector('title')?.textContent || '';
                        const link = item.querySelector('link')?.textContent || '';
                        const pubDate = item.querySelector('pubDate')?.textContent || '';

                        if (title &amp;&amp; link) {
                            results.push({
                                title: title,
                                url: link,
                                content: `掲載日時: ${new Date(pubDate).toLocaleString('ja-JP')}`
                            });
                        }
                    });
                }
            } catch(e) {}

            if (results.length === 0) results = await fetchWikipediaSearch(query);
            return results;
        }

        async function fetchWikipediaSearch(query) {
            try {
                const res = await fetch(`https://ja.wikipedia.org/w/api.php?action=query&amp;list=search&amp;srsearch=${encodeURIComponent(query)}&amp;utf8=&amp;format=json&amp;origin=*`);
                if(res.ok) {
                    const data = await res.json();
                    if (data.query?.search) {
                        return data.query.search.map(item =&gt; ({
                            title: item.title,
                            url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(item.title)}`,
                            content: item.snippet.replace(/&lt;\/?[^&gt;]+(&gt;|$)/g, "")
                        }));
                    }
                }
            } catch(e) {}
            return [];
        }

        async function fetchWikipediaKnowledgePanel(query) {
            const sidebar = document.getElementById('sidebar');
            try {
                const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.extract) {
                        sidebar.innerHTML = `
                            &lt;div class="knowledge-card"&gt;
                                &lt;div class="knowledge-title"&gt;${data.title}&lt;/div&gt;
                                &lt;div class="knowledge-subtitle"&gt;関連情報 (Wikipedia)&lt;/div&gt;
                                &lt;div class="knowledge-desc"&gt;${data.extract}&lt;/div&gt;
                                &lt;a href="${data.content_urls.desktop.page}" target="_blank" class="knowledge-link"&gt;詳細を見る →&lt;/a&gt;
                            &lt;/div&gt;
                        `;
                        sidebar.classList.add('active');
                        return;
                    }
                }
            } catch (err) {}
            sidebar.classList.remove('active');
        }

        async function fetchOmadaMedia(query, page) {
            const omadaApi = document.getElementById('settingOmadaApi').value || 'https://yt.omada.cafe';
            try {
                const res = await fetch(`${omadaApi}/api/v1/search?q=${encodeURIComponent(query)}&amp;page=${page}&amp;type=video`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                return (Array.isArray(data) ? data : []).map(v =&gt; {
                    const isLive = v.isLive === true || v.liveNow === true || (v.lengthSeconds === 0 &amp;&amp; !v.isUpcoming);
                    return {
                        title: v.title,
                        videoId: v.videoId,
                        author: v.author || '不明',
                        lengthText: isLive ? 'ライブ' : `${Math.floor((v.lengthSeconds || 0)/60)}分${(v.lengthSeconds || 0)%60}秒`,
                        viewCountText: v.viewCount ? `${v.viewCount.toLocaleString()} 回視聴` : '',
                        isLive: isLive
                    };
                });
            } catch (err) {
                return [];
            }
        }

        async function fetchSideShorts(query) {
            const sidebar = document.getElementById('sidebar');
            const omadaApi = document.getElementById('settingOmadaApi').value || 'https://yt.omada.cafe';
            try {
                const res = await fetch(`${omadaApi}/api/v1/search?q=${encodeURIComponent(query + ' #shorts')}&amp;type=video`);
                if (!res.ok) return;
                const data = await res.json();

                const shorts = (Array.isArray(data) ? data : []).filter(v =&gt; {
                    const duration = v.lengthSeconds || 0;
                    const isShortTitle = v.title ? v.title.toLowerCase().includes('#shorts') || v.title.toLowerCase().includes('short') : false;
                    return (duration &gt; 0 &amp;&amp; duration &lt;= 60) || isShortTitle;
                }).slice(0, 6);

                if (shorts.length === 0) return;

                let shortsHtml = `
                    &lt;div class="knowledge-card"&gt;
                        &lt;div class="sidebar-section-title"&gt;⚡ ショート動画&lt;/div&gt;
                        &lt;div class="shorts-scroll-container"&gt;
                `;

                shorts.forEach(s =&gt; {
                    const thumbUrl = `https://i.ytimg.com/vi/${s.videoId}/hqdefault.jpg`;
                    shortsHtml += `
                        &lt;div class="short-item-card" onclick="openVideoDetails('${s.videoId}')"&gt;
                            &lt;img class="short-item-thumb" src="${thumbUrl}" alt="short" loading="lazy"&gt;
                            &lt;div class="short-item-title"&gt;${s.title}&lt;/div&gt;
                        &lt;/div&gt;
                    `;
                });

                shortsHtml += `&lt;/div&gt;&lt;/div&gt;`;

                if (sidebar.innerHTML.includes('video-detail-panel')) {
                    sidebar.insertAdjacentHTML('afterbegin', shortsHtml);
                } else {
                    sidebar.innerHTML = shortsHtml;
                }
                sidebar.classList.add('active');
            } catch (e) {}
        }

        function renderNocookieEmbed(container, videoId) {
            container.innerHTML = `
                &lt;iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1"
                    style="width:100%; height:220px; border:none; border-radius:8px; background:#000;"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen&gt;
                &lt;/iframe&gt;
            `;
        }

        async function fetchComments(videoId, targetContainer) {
            const omadaApi = document.getElementById('settingOmadaApi').value || 'https://yt.omada.cafe';
            try {
                const res = await fetch(`${omadaApi}/api/v1/comments/${videoId}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                const comments = data.comments || [];

                if (comments.length === 0) {
                    targetContainer.innerHTML = `&lt;div style="color:var(--text-muted); font-size:12px;"&gt;コメントはありません&lt;/div&gt;`;
                    return;
                }

                let html = '&lt;div class="comments-list"&gt;';
                comments.slice(0, 10).forEach(c =&gt; {
                    html += `
                        &lt;div class="comment-item"&gt;
                            &lt;div class="comment-author"&gt;${c.author}&lt;/div&gt;
                            &lt;div class="comment-content"&gt;${c.contentHtml || c.content}&lt;/div&gt;
                        &lt;/div&gt;
                    `;
                });
                html += '&lt;/div&gt;';
                targetContainer.innerHTML = html;
            } catch (e) {
                targetContainer.innerHTML = `&lt;div style="color:var(--text-muted); font-size:12px;"&gt;コメントを読み込めませんでした&lt;/div&gt;`;

        async function openVideoDetails(videoId) {
            const sidebar = document.getElementById('sidebar');
            const omadaApi = document.getElementById('settingOmadaApi').value || 'https://yt.omada.cafe';

            sidebar.innerHTML = `&lt;div class="video-detail-panel"&gt;&lt;div style="color:var(--text-muted); font-size:13px;"&gt;動画情報を読み込み中...&lt;/div&gt;&lt;/div&gt;`;
            sidebar.classList.add('active');

            let videoData = null;
            try {
                const res = await fetch(`${omadaApi}/api/v1/videos/${videoId}`);
                if (res.ok) videoData = await res.json();
            } catch(e) {}

            let streamUrl = null;
            if (videoData?.formatStreams?.length) {
                streamUrl = videoData.formatStreams[0].url;
            } else {
                streamUrl = `${omadaApi}/latest_version?id=${videoId}&amp;itag=22`;
            }

            const title = videoData ? videoData.title : '動画再生';
            const author = videoData ? videoData.author : '';
            const description = videoData ? (videoData.description || '概要欄はありません。') : '';

            sidebar.innerHTML = `
                &lt;div class="video-detail-panel"&gt;
                    &lt;div id="videoPlayerContainer"&gt;
                        &lt;video class="video-player-element" style="width:100%; border-radius:8px; background:#000;" controls autoplay src="${streamUrl}" onerror="renderNocookieEmbed(document.getElementById('videoPlayerContainer'), '${videoId}')"&gt;&lt;/video&gt;
                    &lt;/div&gt;
                    &lt;div class="detail-title" style="margin-top:12px;"&gt;${title}&lt;/div&gt;
                    &lt;div class="detail-author"&gt;${author}&lt;/div&gt;
                    &lt;div class="detail-desc"&gt;${description}&lt;/div&gt;

                    &lt;div class="sidebar-section-title"&gt;💬 コメント&lt;/div&gt;
                    &lt;div id="commentsContainer"&gt;
                        &lt;div style="color:var(--text-muted); font-size:12px;"&gt;コメント読み込み中...&lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            `;

            fetchSideShorts(currentQuery || title);
            fetchComments(videoId, document.getElementById('commentsContainer'));
        }

        async function fetchRakutenShoppingAPI(query, page) {
  const appId=document.getElementById('settingRakutenAppId').value||'1018224734614210871';
