    /* ==========================================================
       1. デザインシステム & カラーパレット
       ========================================================== */
    :root {
      --g-blue: #4285f4;
      --g-red: #ea4335;
      --g-yellow: #fbbc05;
      --g-green: #34a853;

      /* ライトモード */
      --bg-base: #f0f4f9;
      --text-main: #111827;
      --btn-primary-bg: #1a73e8;
      --btn-primary-text: #ffffff;
      --btn-hover: #1557b0;
      --glow-color: rgba(26, 115, 232, 0.35);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* ダークモード */
        --bg-base: #0a0e17;
        --text-main: #f3f4f6;
        --btn-primary-bg: #8ab4f8;
        --btn-primary-text: #061121;
        --btn-hover: #aecbfa;
        --glow-color: rgba(138, 180, 248, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================
       2. 背景キャンバス & オーロラグロー
       ========================================================== */
    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      width: 70vw;
      height: 70vw;
      max-width: 800px;
      max-height: 800px;
      border-radius: 50%;
      opacity: 0.35;
      will-change: transform;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 14s infinite alternate ease-in-out;
    }

    .glow-1 { top: -20%; left: -10%; background: radial-gradient(circle, var(--g-blue) 0%, transparent 68%); }
    .glow-2 { bottom: -20%; right: -10%; background: radial-gradient(circle, var(--g-red) 0%, transparent 68%); animation-delay: -7s; }
    body.instance-active .ambient-glow, body.instance-active #particleCanvas, body.instance-active .bg-overlay { display: none; animation: none; }
    @media (prefers-reduced-motion: reduce) { .ambient-glow { animation: none; } }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(0.9); }
      100% { transform: translate(50px, 30px) scale(1.1); }
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.03);
      z-index: 0;
      pointer-events: none;
    }

    /* ==========================================================
       3. メインコンテンツ（welcome & ボタン）
       ========================================================== */
    .welcome-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      text-align: center;
      padding: 20px;
    }

    /* 手書きアニメーション welcome テキスト */
    .glass-welcome {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 6.5rem);
      flex-wrap: wrap;
      justify-content: center;
      color: var(--text-main);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      letter-spacing: 0.05em;
      display: inline-flex;
    }

    .glass-welcome span {
      display: inline-block;
      opacity: 0;
      transform: translateY(15px) rotate(-5deg);
      animation: writeChar 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* 各文字のアニメーション開始ディレイ */
    .glass-welcome span:nth-child(1) { animation-delay: 0.1s; }
    .glass-welcome span:nth-child(2) { animation-delay: 0.3s; }
    .glass-welcome span:nth-child(3) { animation-delay: 0.5s; }
    .glass-welcome span:nth-child(4) { animation-delay: 0.7s; }
    .glass-welcome span:nth-child(5) { animation-delay: 0.9s; }
    .glass-welcome span:nth-child(6) { animation-delay: 1.1s; }
    .glass-welcome span:nth-child(7) { animation-delay: 1.3s; }
    .glass-welcome span:nth-child(8) { animation-delay: 1.5s; }

    @keyframes writeChar {
      0% {
        opacity: 0;
        transform: translateY(15px) rotate(-5deg) scale(0.8);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
        filter: blur(0);

    /* 次へボタン */
    .btn-next {

      font-weight: 600;
      cursor: pointer;
      border: none;
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      box-shadow: 0 8px 24px var(--glow-color);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),

    }

    /* アニメーション終了後に付与する表示用クラス */
    .btn-next.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn-next:hover {
      background-color: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px var(--glow-color);
    }

    .btn-next:active {
      transform: translateY(0);
      box-shadow: 0 4px 16px var(--glow-color);
    }

    .btn-next svg {
      width: 20px;
      height: 20px;
      transition: transform 0.25s ease;
    }

    .btn-next:hover svg {
      transform: translateX(4px);
    }
    #instanceFrame { position: fixed; inset: 0; z-index: 100; width: 100%; height: 100%; border: 0; background: var(--bg-base); }
    #instanceFrame[hidden] { display: none; }
    #instanceFrame { opacity: 0; transition: opacity .6s ease; }
    #instanceFrame.is-shown { opacity: 1; }
    .welcome-container, .ambient-glow, #particleCanvas { transition: opacity .9s ease, filter .9s ease; }
    body.welcome-fade .welcome-container { opacity: 0; filter: blur(6px); }
    body.welcome-fade .ambient-glow, body.welcome-fade #particleCanvas { opacity: 0; }

    /* スキップボタン（右下） */
    .btn-skip {
      position: fixed;
      right: calc(20px + env(safe-area-inset-right, 0px));
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));

      padding: 10px 22px;
      border-radius: 100px;
      border: 1px solid color-mix(in srgb, var(--text-main) 25%, transparent);
      background: color-mix(in srgb, var(--bg-base) 55%, transparent);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--text-main);
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .05em;
      cursor: pointer;
      transition: opacity .9s ease, background-color .25s ease, transform .25s ease;
    }
    .btn-skip:hover { background: color-mix(in srgb, var(--bg-base) 85%, var(--text-main) 15%); transform: translateY(-2px); }
    .btn-skip:focus-visible { outline: 2px solid var(--btn-primary-bg); outline-offset: 3px; }
    body.welcome-fade .btn-skip { opacity: 0; pointer-events: none; }
    body.instance-active .btn-skip { display: none; }
    body.instance-active { overflow: hidden; }
    body.instance-active .ambient-glow,
    body.instance-active .bg-overlay,
    body.instance-active #particleCanvas,
    body.instance-active .welcome-container { display: none; }

    /* Glass skip control — transparent glass with a crisp reflected rim */
    .btn-skip {
      min-height: 48px;
      padding: 10px 21px;
      border: 1px solid color-mix(in srgb, white 68%, var(--text-main) 14%);
      background:
        linear-gradient(115deg, color-mix(in srgb, white 24%, transparent), transparent 44%),
        color-mix(in srgb, var(--bg-base) 16%, transparent);
      backdrop-filter: blur(24px) saturate(185%) brightness(1.06);
      box-shadow:
        inset 0 1px 0 color-mix(in srgb, white 84%, transparent),
        inset 0 0 0 1px color-mix(in srgb, white 12%, transparent),
        inset 0 -12px 24px color-mix(in srgb, var(--btn-primary-bg) 6%, transparent),
        0 12px 30px color-mix(in srgb, var(--text-main) 13%, transparent),
        0 2px 7px color-mix(in srgb, var(--text-main) 10%, transparent);
      text-shadow: 0 1px 10px color-mix(in srgb, var(--bg-base) 90%, transparent);
      overflow: hidden;
      isolation: isolate;
      will-change: transform;
    }
    .btn-skip::before {
      content: "";
      position: absolute;
      left: 13%;
      right: 38%;
      top: 2px;
      height: 38%;
      border-radius: 999px;
      background: linear-gradient(180deg, color-mix(in srgb, white 65%, transparent), transparent);
      filter: blur(5px);
      opacity: .8;
      pointer-events: none;
    }
    .btn-skip:hover {
      background: linear-gradient(115deg, color-mix(in srgb, white 30%, transparent), color-mix(in srgb, var(--btn-primary-bg) 11%, transparent));
      border-color: color-mix(in srgb, white 78%, var(--btn-primary-bg) 22%);
      box-shadow: inset 0 1px 0 color-mix(in srgb, white 88%, transparent), 0 17px 38px color-mix(in srgb, var(--btn-primary-bg) 21%, transparent);
    }
    .btn-skip:active { transform: translateY(0) scale(.97); }
    @media (max-width: 600px) {
      .btn-skip {
        right: calc(14px + env(safe-area-inset-right, 0px));
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        min-height: 46px;
        padding: 9px 18px;
        font-size: .86rem;
      }
    }
    @media (prefers-reduced-motion: reduce) { .btn-skip { transition-duration: .15s; } }

<body>

  <canvas id="particleCanvas" hidden></canvas>
  <main class="cf-verify" id="cfVerify">
    <div class="cf-head">
      <img class="cf-logo" src="/favicon.png" alt="">
      <h1 class="cf-domain" id="cfDomain">nakayosi</h1>
    </div>
    <h2 class="cf-title" id="cfTitle">Performing security verification</h2>
    <p class="cf-desc" id="cfDesc">This website uses a security service to protect against malicious bots. This page is displayed while the website verifies you are not a bot.</p>
    <div class="cf-status"><span class="cf-spinner" id="cfSpinner" aria-label="確認中"></span><span class="cf-ok" id="cfOk" hidden>&#10003;</span></div>
    <footer class="cf-foot">
      <div>Ray ID: <code id="cfRay"></code></div>
      <div>Performance and Security by <a href="javascript:void(0)">Nakayosi</a> <span class="cf-sep">|</span> <a href="javascript:void(0)">Privacy</a></div>
    </footer>
  </main>

  <iframe id="instanceFrame" title="仲良し ~*インスタンス*~ 3 — 情報ポータル" hidden></iframe>

  <script>
    // ==========================================================
    // 1. パーティクルキャンバス制御
    // ==========================================================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = Array.from({ length: 30 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 2.5 + 1,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.2
    }));

    const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
    function animateParticles() {
      if (document.hidden) { particleRaf = requestAnimationFrame(animateParticles); return; }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDark = darkMq.matches;
      ctx.fillStyle = isDark ? '#fff' : '#000';

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.globalAlpha = isDark ? p.alpha : p.alpha * 0.35;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      if (!window.__welcomeDone) particleRaf = requestAnimationFrame(animateParticles);
    }
    let particleRaf = 0;
    animateParticles();

    // ==========================================================
    // 2. アニメーション完了後のボタン表示制御
    // ==========================================================
    // welcome アニメーション後、自動でフェードアウトしてポータルを表示

    // ===== URLルーティング (/in, /links など) =====
    const CALL_URL = 'https://bizmee.net/nakayosi-in-2';
    const ROUTE_PAGES = ['in','home','news','weather','events','calendar','links','games','settings','terms','tools','chats','call'];
    const ROUTER = (function(){
      const url = new URL(location.href);
      let base, initial = '';
      const r = url.searchParams.get('route');
      if (r !== null) {
        base = url.pathname.replace(/index\.html$/,'');
        initial = r.replace(/^\/+|\/+$/g,'').split('/')[0].toLowerCase();
        url.searchParams.delete('route');
      } else {
        const segs = url.pathname.split('/');
        const i = segs.findIndex((x,k)=>k>0 && ROUTE_PAGES.includes(x.toLowerCase()));
        if (i > 0) { base = segs.slice(0,i).join('/') + '/'; initial = segs[i].toLowerCase(); }
        else base = url.pathname.replace(/[^\/]*$/,'');
      }
      if (!base.endsWith('/')) base += '/';
      if (initial === 'call') { location.replace(CALL_URL); }
      if (!ROUTE_PAGES.includes(initial) || initial === 'in' || initial === 'call') initial = 'home';
      const qs = url.searchParams.toString();
      const tail = (qs ? '?' + qs : '') + url.hash;
      if (initial !== 'chats') history.replaceState({page:'in', target:initial}, '', base + 'in' + tail);
      return { base, initial, tail };
    })();
    const PAGE_TITLES = {
      in:'ようこそ', home:'ホーム', news:'お知らせ', weather:'天気',
      events:'イベント', calendar:'カレンダー', links:'リンク集', games:'ゲーム',
      tv:'TV', search:'検索', settings:'設定', terms:'利用規約', tools:'ミニ機能', chats:'仲良しCHAT', call:'通話'
    };
    function pageTitle(id){ return (PAGE_TITLES[id] || PAGE_TITLES.home) + ' -- 仲良し ~*インスタンス*~ 3 情報ポータル'; }
    function updatePageTitle(id){
      const frame = document.getElementById('instanceFrame');
      const w = frame && frame.contentWindow;
      let title = pageTitle(id);
      try {
        const mode = w && typeof w.loadSettings === 'function' ? w.loadSettings().disguise : 'off';
        const preset = ({google:{title:'Google'},gtranslate:{title:'Google 翻訳'},classroom:{title:'ホーム - Classroom'}})[mode];
        if(preset && preset.title) title = preset.title;
        if(frame && frame.contentDocument) frame.contentDocument.title = title;
      } catch(e) {}
      document.title = title;
    }
    function routeUrl(id){ return ROUTER.base + id; }
    function hookInstance(frame){
      try {
        const w = frame.contentWindow;
        const orig = w.showPage;
        if (typeof orig !== 'function') return;
        let silent = false;
        const wrapped = function(id){
          if (id === 'call') { window.open(CALL_URL, "_blank", "noopener"); return; }
          const res = orig.apply(this, arguments);
          updatePageTitle(id);
          if (!silent && ROUTE_PAGES.includes(id) && history.state?.page !== id) {
            history.pushState({page:id}, '', routeUrl(id));
          }
          return res;
        };
        w.showPage = wrapped;
        const go = (id) => { silent = true; try { orig.call(w, id); updatePageTitle(id); } finally { silent = false; } };
        go(ROUTER.initial);
        history.replaceState({page:ROUTER.initial}, '', routeUrl(ROUTER.initial) + ROUTER.tail);
        window.addEventListener('popstate', (e) => {
          let id = e.state?.page;
          if (!id || id === 'in') id = 'home';
          if (ROUTE_PAGES.includes(id)) go(id);
          if (e.state?.page === 'in') history.replaceState({page:'home'}, '', routeUrl('home'));
        });
      } catch (err) { console.error('router', err); }
    }
    let instanceStarted = false;
    function showInstance() {
      if (instanceStarted) return;
      instanceStarted = true;
      const frame = document.getElementById('instanceFrame');
      const source = document.getElementById('instanceSource');
      if (!frame || !source) return;
      let loaded = false, faded = false;
      const reveal = () => {
        if (!loaded || !faded) return;
        window.__welcomeDone = true;
        cancelAnimationFrame(particleRaf);
        window.removeEventListener('resize', resizeCanvas);
        canvas.width = canvas.height = 0;
        frame.hidden = false;
        requestAnimationFrame(() => frame.classList.add('is-shown'));
        document.body.classList.add('instance-active');
        updatePageTitle(ROUTER.initial);
      };
      frame.addEventListener('load', () => {
        const innerDocument = frame.contentDocument;
        hookInstance(frame);
        loaded = true; reveal();
      }, { once: true });
      document.body.classList.add('welcome-fade');
      setTimeout(() => { faded = true; reveal(); }, 900);
      frame.srcdoc = source.content.textContent.replace(/tag\s*:\s*"[^"]*"(?:\s*,\s*tag\s*:\s*"[^"]*")+/g, m => 'tag:' + JSON.stringify((m.match(/"[^"]*"/g)||[]).map(x => x.slice(1,-1))));
    }
    // スキップ：アニメーションを待たずにすぐポータルへ

    // 手書きアニメーションが本当に終わってから（最後の文字の animationend）少し余韻を置いて自動で消える
    (function runVerification() {
      document.getElementById('cfDomain').textContent = location.hostname || 'nakayosi';
      document.getElementById('cfRay').textContent = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2,'0')).join('');
      var VKEY='nakayosiLastVisit', now=Date.now(), last=0;
      try { last = +localStorage.getItem(VKEY) || 0; localStorage.setItem(VKEY, String(now)); } catch(e) {}
      // 3日以内に来ていれば認証画面を出さずにすぐ開く
      if (last && now - last < 3*24*60*60*1000) { document.getElementById('cfVerify').style.display='none'; if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', showInstance, { once: true }); else showInstance(); return; }
      if (ROUTER.initial === 'chats') { document.addEventListener('DOMContentLoaded', showInstance, { once: true }); return; }
      setTimeout(() => {
        document.getElementById('cfSpinner').hidden = true;
        document.getElementById('cfOk').hidden = false;
        document.getElementById('cfTitle').textContent = 'Verification successful';
        document.getElementById('cfDesc').textContent = 'Waiting for ' + (location.hostname || 'the site') + ' to respond...';
        setTimeout(showInstance, 700);
      }, 2200);
    })();
  </script>

&lt;!DOCTYPE html&gt;
&lt;html lang="ja"&gt;
&lt;head&gt;

&lt;style&gt;
/* ============================================================
   仲良し ~*インスタンス*~ 3  ／  情報サイト風UI
   - 編集しやすいよう、リンク/ゲーム/お知らせは &lt;script&gt; 内の
     データ配列を書き換えるだけでOKです。
   - カラーは :root のCSS変数を編集してください。
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Serif+JP:wght@600;700&amp;family=Press+Start+2P&amp;family=M+PLUS+Rounded+1c:wght@400;500;700&amp;family=Kosugi+Maru&amp;family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Shippori+Mincho:wght@500;700&amp;family=Kaisei+Decol:wght@400;700&amp;family=DotGothic16&amp;family=Yusei+Magic&amp;family=Noto+Color+Emoji&amp;display=swap');

/* リアルタイム時計（ピクセルフォント） */
.pixel-clock{
  font-family:'Press Start 2P','Courier New',monospace;
  font-size:2rem;
  letter-spacing:3px;
  color:var(--primary);
  padding:12px 20px;
  border:3px solid var(--primary);
  border-radius:8px;
  background:var(--surface-2);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  display:inline-block;
  line-height:1;
  box-shadow:0 4px 14px -6px color-mix(in oklab, var(--primary) 55%, transparent), inset 0 0 0 1px color-mix(in oklab, var(--primary) 20%, transparent);
  text-shadow:0 0 8px color-mix(in oklab, var(--primary) 45%, transparent);
}
@media(max-width:600px){.pixel-clock{font-size:1.4rem;padding:8px 12px;letter-spacing:2px}}
.brand-clock{margin-left:18px;vertical-align:middle}
/* 通知ベル */
.notif-btn{position:relative;background:transparent;border:none;font-size:1.35rem;cursor:pointer;padding:6px 8px;border-radius:8px;color:inherit;line-height:1;transition:background .15s;display:inline-flex;align-items:center;justify-content:center}
.notif-btn .notif-ico{width:22px;height:22px;display:block;color:currentColor;transition:transform .2s}
.notif-btn:hover .notif-ico{transform:rotate(-12deg) scale(1.08)}
.notif-btn.has-new .notif-ico{animation:notifShake 2.2s ease-in-out infinite;transform-origin:50% 10%}
@keyframes notifShake{0%,88%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}92%{transform:rotate(12deg)}94%{transform:rotate(-10deg)}96%{transform:rotate(8deg)}98%{transform:rotate(-4deg)}}
.notif-btn:hover{background:color-mix(in oklab, var(--primary) 15%, transparent)}
.notif-dot{position:absolute;top:4px;right:4px;width:10px;height:10px;background:#e11d48;border:2px solid var(--header-bg,#fff);border-radius:50%;display:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.notif-btn.has-new .notif-dot{display:block;animation:notifPulse 1.6s ease-in-out infinite}
@keyframes notifPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
.notif-panel{position:absolute;top:calc(100% + 8px);right:0;width:min(340px,calc(100vw - 24px));background:var(--surface,#fff);color:var(--text,inherit);border:1px solid var(--border,#e5e7eb);border-radius:12px;box-shadow:0 12px 32px -8px rgba(0,0,0,.25);z-index:1200;display:none;overflow:hidden}
.notif-panel.open{display:block}
.notif-panel .np-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9rem}
.notif-panel .np-list{max-height:360px;overflow-y:auto;list-style:none;margin:0;padding:0}
.notif-panel .np-list li{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.85rem;line-height:1.45}
.notif-panel .np-list li:last-child{border-bottom:none}
.notif-panel .np-list li.new{background:color-mix(in oklab, #e11d48 8%, transparent)}
.notif-panel .np-list .np-date{color:var(--text-muted);font-size:.72rem;display:block;margin-bottom:2px;font-variant-numeric:tabular-nums}
.notif-panel .np-list .np-badge{display:inline-block;font-size:.62rem;padding:1px 6px;border-radius:4px;background:#e11d48;color:#fff;margin-left:6px;vertical-align:middle}
.notif-wrap{position:relative;display:inline-block}
/* 動画対応 */
.nm-video{width:100%;border-radius:8px;background:#000;margin-bottom:10px;max-height:60vh}
.nm-yt-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;background:#000;margin-bottom:10px;overflow:hidden}
.nm-yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
body.dark-mode .pixel-clock{background:#0a1220}

/* 速報／ニュースティッカー */
.ticker{
  display:flex;
  align-items:center;
  gap:0;
  background:linear-gradient(90deg,#0a0d12 0%,#1a1f2a 100%);
  color:#e6e8eb;
  font-size:.85rem;
  padding:10px 0;
  overflow:hidden;
  border-bottom:1px solid var(--border);
}
.ticker-inner{
  max-width:1180px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:0;
  width:100%;
}
.ticker-label{
  flex-shrink:0;
  padding:9px 14px;
  font-weight:700;
  font-size:.75rem;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.ticker-label.eq{background:#b91c1c;color:#fff}
.ticker-label.eq::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff6b5b}
.ticker-label.news{background:#0b5fa5;color:#fff}
.ticker-track{
  flex:1;
  overflow:hidden;
  position:relative;
  mask-image:linear-gradient(90deg,transparent 0%,#000 4%,#000 96%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 4%,#000 96%,transparent 100%);
}
.ticker-move{
  display:inline-flex;
  gap:56px;
  white-space:nowrap;
  animation:tickerScroll 70s linear infinite;
}
@keyframes tickerScroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}
.ticker-item{display:inline-flex;align-items:center;gap:6px}
body.dark-mode .ticker{background:#05070a;border-color:#2a2f37}

@font-face{font-family:'HuiFont';src:url('/fonts/HuiFontP109.woff') format('woff');font-display:swap}
body,body *:not(svg):not(path):not(code):not(pre):not(kbd){font-family:'HuiFont','Noto Sans JP','Noto Color Emoji',sans-serif!important}
.brand-counter{display:inline-block;height:80px;width:auto;max-width:460px;margin-left:14px;vertical-align:middle;image-rendering:pixelated;border-radius:6px}
@media(max-width:600px){.brand-counter{display:block;height:48px;max-width:250px;margin:8px 50px 0 0;justify-self:center}}
body.choco-mode{
  --bg:#2b1a12;--surface:#3d261a;--surface-2:#4a2e20;--text:#f5e6d3;--text-muted:#c9a88a;
  --border:#5c3a28;--primary:#d9a066;--primary-hover:#e8b884;--accent:#ff8fa3;
  --header-bg:#3d261a;--topbar-bg:#1f120c;--topbar-text:#f5e6d3;--tag-bg:#4f3122;
  background:#2b1a12 repeating-linear-gradient(0deg,transparent 0 58px,rgba(0,0,0,.18) 58px 62px),repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.18) 58px 62px)!important;color:var(--text)
}
body.choco-mode .site-header{background:linear-gradient(180deg,#4a2e20,#3d261a)!important;border-bottom:4px solid #1f120c!important;box-shadow:0 3px 0 #6b4430 inset}
body.choco-mode .card,body.choco-mode .news-card,body.choco-mode section,body.choco-mode .setting-row{border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,220,180,.12),inset 0 -4px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.35)}
body.choco-mode .btn,body.choco-mode button.btn{background:linear-gradient(180deg,#8a5a3c,#5c3a28)!important;color:#fff4e6!important;border:1px solid #2b1a12!important;border-radius:999px;box-shadow:inset 0 2px 0 rgba(255,220,180,.3),0 3px 0 #1f120c}
body.choco-mode a{color:#e8b884}
body.choco-mode input,body.choco-mode select,body.choco-mode textarea{background:#2b1a12;color:#f5e6d3;border-color:#6b4430}
body.choco-mode .ticker{background:linear-gradient(90deg,#1f120c,#3d261a);border-color:#5c3a28}
body.choco-mode .gnav,body.choco-mode footer{background:#1f120c!important;color:#f5e6d3}
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --text:#1a1a1a;
  --text-muted:#6b7280;
  --border:#e3e6eb;
  --primary:#0b5fa5;
  --primary-hover:#094a82;
  --accent:#c0392b;
  --header-bg:#ffffff;
  --topbar-bg:#0b5fa5;
  --topbar-text:#ffffff;
  --tag-bg:#eef3f9;
}
body.dark-mode{
  --bg:#0f1115;
  --surface:#171a20;
  --surface-2:#1c2027;
  --text:#e6e8eb;
  --text-muted:#9aa0a6;
  --border:#2a2f37;
  --primary:#5aa9ff;
  --primary-hover:#7dbcff;
  --accent:#ff6b5b;
  --header-bg:#171a20;
  --topbar-bg:#0a0d12;
  --topbar-text:#e6e8eb;
  --tag-bg:#222831;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Noto Sans JP','Noto Color Emoji',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.7;
  transition:background .25s,color .25s;
}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{font-family:'Noto Serif JP','Noto Color Emoji',serif;line-height:1.35;margin:0 0 .5em}

/* ───── トップバー（青い細い帯） ───── */
.topbar{
  background:var(--topbar-bg);color:var(--topbar-text);
  font-size:.78rem;padding:6px 0;
}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar a{color:var(--topbar-text);opacity:.85}
.topbar a:hover{opacity:1;text-decoration:none}
.topbar .crumbs span{opacity:.7}

/* ───── サイトヘッダー ───── */
.site-header{
  background:var(--header-bg);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1180px;margin:0 auto;padding:18px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text)}
.brand-logo{
  width:44px;height:44px;border-radius:6px;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif JP',serif;font-weight:700;font-size:1.4rem;
}
.brand-title{font-family:'Noto Serif JP',serif;font-size:1.4rem;font-weight:700;letter-spacing:.5px}
.brand-sub{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.header-search{display:flex;align-items:center;gap:8px}
.header-search input{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  padding:8px 12px;border-radius:4px;font-size:.85rem;width:220px;outline:none;
}
.header-search input:focus{border-color:var(--primary)}
.icon-btn{
  background:transparent;border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:4px;cursor:pointer;font-size:1rem;
}
.icon-btn:hover{background:var(--surface-2)}
.theme-toggle-btn{border:none !important;background:transparent;border-radius:8px}
.theme-toggle-btn:hover{background:color-mix(in oklab, var(--primary) 15%, transparent)}

/* ───── グローバルナビ ───── */
.gnav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.gnav-inner{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;overflow-x:hidden}
.gnav-links{display:flex;flex-wrap:wrap;align-items:center;gap:0;width:100%}
.gnav a{
  padding:10px 13px;color:var(--text);font-weight:500;font-size:.88rem;
  border-bottom:3px solid transparent;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.nav-ic{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.gnav a:hover .nav-ic,.gnav a.active .nav-ic{opacity:1}
.gnav a:hover{color:var(--primary);text-decoration:none;background:var(--surface-2)}
.gnav a.active{color:var(--primary);border-bottom-color:var(--primary)}
.gnav .menu-toggle{display:none}

/* ───── レイアウト ───── */
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:1fr 320px;gap:28px}
.main{min-width:0}
.aside{min-width:0}
@media (max-width:880px){
  .wrap{grid-template-columns:1fr}
  .header-search input{width:140px}
}
/* タブレット幅も含め、ハンバーガーメニューに切り替え */
@media (max-width:1024px){
  .gnav .menu-toggle{display:flex;align-items:center;justify-content:center;padding:12px 14px;border:none;background:transparent;color:var(--text);cursor:pointer;font-size:1.2rem}
  .gnav-inner &gt; .gnav-links{display:none;flex-direction:column;width:100%}
  .gnav-inner.open &gt; .gnav-links{display:flex}
  .gnav-inner{flex-wrap:wrap}
  .gnav a{width:100%;border-bottom:1px solid var(--border)}
}

/* ───── ヒーロー（情報サイト風の特集） ───── */
.hero{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:30px;margin-bottom:24px;
  display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;
}
.hero h1{font-size:1.7rem;margin:0 0 8px}
.hero p{margin:0;color:var(--text-muted)}
.hero .tag{display:inline-block;background:var(--tag-bg);color:var(--primary);font-size:.72rem;padding:3px 10px;border-radius:3px;font-weight:700;margin-bottom:10px;letter-spacing:.05em}
@media(max-width:600px){.hero{grid-template-columns:1fr}}

/* ───── ホーム専用（リデザイン） ───── */
#home-page .home-hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(1200px 400px at 100% -20%, color-mix(in oklab, var(--primary) 22%, transparent), transparent 60%),
    radial-gradient(600px 300px at 0% 120%, color-mix(in oklab, var(--primary) 14%, transparent), transparent 60%),
    var(--surface);
  border:1px solid var(--border);
  padding:40px 36px;
  display:grid;grid-template-columns:1.4fr .8fr;gap:24px;align-items:center;
}
#home-page .home-hero h1{font-size:2rem;line-height:1.25;margin:6px 0 10px;letter-spacing:-.01em}
#home-page .home-hero h1 em{font-style:normal;color:var(--primary);font-weight:800}
#home-page .home-hero p{max-width:56ch;font-size:.95rem;line-height:1.7}
#home-page .home-hero-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
#home-page .home-hero .btn-ghost{
  background:transparent;color:var(--text);
  border:1px solid var(--border);
}
#home-page .home-hero .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
#home-page .home-hero-deco{
  align-self:stretch;min-height:120px;border-radius:12px;
  background:
    conic-gradient(from 210deg at 70% 30%, color-mix(in oklab, var(--primary) 40%, transparent), transparent 45%),
    linear-gradient(135deg, color-mix(in oklab, var(--primary) 18%, transparent), transparent 60%);
  border:1px solid var(--border);
  mask:linear-gradient(180deg,#000 60%,transparent);
}
@media(max-width:820px){
  #home-page .home-hero{grid-template-columns:1fr;padding:28px 22px}
  #home-page .home-hero-deco{display:none}
  #home-page .home-hero h1{font-size:1.55rem}
}

#home-page .home-quick{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;
}
#home-page .home-quick a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:14px 8px;border-radius:14px;background:var(--surface-2,var(--surface));
  border:1px solid var(--border);color:var(--text);text-decoration:none;
  font-size:.78rem;font-weight:600;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
#home-page .home-quick a:hover{
  transform:translateY(-3px);border-color:var(--primary);text-decoration:none;
  box-shadow:0 10px 22px -14px color-mix(in oklab, var(--primary) 55%, transparent);
}
#home-page .home-quick a svg{
  width:22px;height:22px;fill:none;stroke:currentColor;color:var(--primary);
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
@media(max-width:480px){
  #home-page .home-quick{grid-template-columns:repeat(3,1fr)}
}

#home-page .home-grid-2{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;
}
#home-page .home-grid-2 .section{margin-bottom:0;height:100%}
@media(max-width:820px){
  #home-page .home-grid-2{grid-template-columns:1fr}
}

#home-page .section{transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease}
#home-page .section:hover{
  border-color:color-mix(in oklab, var(--primary) 45%, var(--border));
}
#home-page .section-head{
  background:linear-gradient(180deg, color-mix(in oklab, var(--primary) 4%, transparent), transparent);
}

/* ───── セクション共通 ───── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:24px}
.section-head{
  padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.section-head h2{font-size:1.1rem;margin:0;display:flex;align-items:center;gap:10px}
.section-head h2::before{content:"";width:4px;height:18px;background:var(--primary);border-radius:2px}
.section-head .more{font-size:.8rem;color:var(--text-muted)}
.section-body{padding:18px 20px}

/* ニュース一覧 */
.news-list{list-style:none;margin:0;padding:0}
.news-list li{
  display:grid;grid-template-columns:90px 70px 1fr;gap:14px;
  padding:12px 0;border-bottom:1px dashed var(--border);align-items:baseline;font-size:.92rem;
}
.news-list li:last-child{border-bottom:none}
.news-list .date{color:var(--text-muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.news-list .cat{
  font-size:.7rem;padding:2px 6px;border-radius:3px;text-align:center;
  background:var(--tag-bg);color:var(--primary);font-weight:700;
}
.news-list .cat.update{background:#fdecea;color:#c0392b}
body.dark-mode .news-list .cat.update{background:#3a1f1d;color:#ff8a7a}
@media(max-width:520px){.news-list li{grid-template-columns:auto auto;grid-template-rows:auto auto}.news-list .title{grid-column:1/-1}}

/* リンクカテゴリ（カード風・タイル型UI） */
.link-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.link-cat{
  position:relative;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 18px 14px;
  background:linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  overflow:hidden;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.link-cat::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--primary),var(--accent));
}
.link-cat:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px color-mix(in oklab, var(--primary) 45%, transparent);border-color:color-mix(in oklab, var(--primary) 45%, var(--border))}
.link-cat h3{
  font-family:inherit;font-size:1rem;font-weight:700;
  margin:0 0 14px;padding:0 0 10px 6px;
  border-bottom:1px dashed var(--border);
  color:var(--primary);letter-spacing:.02em;
}
.link-cat ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:340px;overflow-y:auto}
.link-cat ul::-webkit-scrollbar{width:6px}
.link-cat ul::-webkit-scrollbar-track{background:transparent}
.link-cat ul::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--primary) 35%,transparent);border-radius:3px}
.link-cat li{
  padding:0;font-size:.9rem;display:block;
}
.link-cat li::before{content:none}
.link-cat li a{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  transition:.18s ease;
  font-weight:500;
}
.link-cat li a::before{
  content:"→";
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:6px;
  background:color-mix(in oklab, var(--primary) 12%, transparent);
  color:var(--primary);font-weight:700;font-size:.85rem;
  flex-shrink:0;
  transition:.18s ease;
}
.link-cat li a:hover{
  background:color-mix(in oklab, var(--primary) 10%, var(--surface));
  border-color:var(--primary);
  color:var(--primary);
  text-decoration:none;
  transform:translateX(3px);
}
.link-cat li a:hover::before{background:var(--primary);color:#fff;transform:translateX(2px)}
body.dark-mode .link-cat li a{background:var(--surface-2)}
body.dark-mode .link-cat li a:hover{background:color-mix(in oklab, var(--primary) 18%, var(--surface-2))}

/* ゲームグリッド — CrazyGames風 */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.game-card{
  position:relative;background:var(--surface-2);border:none;border-radius:14px;
  overflow:hidden;cursor:pointer;transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
  isolation:isolate;
}
.game-card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 28px -10px rgba(0,0,0,.35),0 6px 12px -8px rgba(0,0,0,.25);z-index:2}
.game-card .thumb{aspect-ratio:1/1;background:#0b0f17;overflow:hidden;border-radius:14px;position:relative}
.game-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.game-card:hover .thumb img{transform:scale(1.08)}
.game-card .thumb::after{
  content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.72) 100%);
  opacity:.85;transition:opacity .2s;
}
.game-card:hover .thumb::after{opacity:1;background:linear-gradient(180deg,rgba(124,58,237,.15) 0%,rgba(0,0,0,.85) 100%)}
.game-card .name{
  position:absolute;left:10px;right:10px;bottom:8px;
  font-size:.82rem;font-weight:700;color:#fff;line-height:1.25;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  z-index:1;padding:0;
}
.game-card .play-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
  width:54px;height:54px;border-radius:50%;
  background:rgba(124,58,237,.95);color:#fff;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s, transform .2s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 8px 20px -6px rgba(124,58,237,.7),0 0 0 4px rgba(255,255,255,.15);
  pointer-events:none;z-index:1;
}
.game-card:hover .play-badge{opacity:1;transform:translate(-50%,-50%) scale(1)}
.game-card .play-badge svg{width:22px;height:22px;margin-left:3px;fill:#fff}
.game-card .hot-tag{
  position:absolute;top:8px;left:8px;z-index:1;
  background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;
  font-size:.62rem;font-weight:800;letter-spacing:.5px;
  padding:3px 8px;border-radius:6px;text-transform:uppercase;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
@media(max-width:600px){.game-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.game-card .name{font-size:.76rem}}

/* サイドバーウィジェット */
.widget{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:20px}
.widget-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px}
.widget-head::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
.widget-body{padding:14px 16px;font-size:.88rem}
.widget-body ul{list-style:none;margin:0;padding:0}
.widget-body li{padding:6px 0;border-bottom:1px dashed var(--border)}
.widget-body li:last-child{border-bottom:none}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:.88rem}
/* 今日の日付 ＋ おみくじ（サイト情報ウィジェット） */
.site-today{font-weight:700;font-size:.92rem;color:var(--primary);padding:6px 0;margin-bottom:4px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.site-omikuji-box{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);text-align:center}
.site-omikuji-btn{display:inline-block;font:inherit;font-weight:700;font-size:.85rem;color:var(--primary);background:var(--surface-2);border:1px solid var(--primary);border-radius:999px;padding:7px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s,color .2s}
.site-omikuji-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px color-mix(in oklab, var(--primary) 35%, transparent);background:var(--primary);color:#fff}
.site-omikuji-btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;background:var(--surface-2);color:var(--muted-foreground,#6b7280);border-color:var(--border)}
.site-omikuji-result{margin-top:10px;min-height:1em;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.site-omikuji-result.show{opacity:1;transform:translateY(0)}
.site-omikuji-rank{display:block;font-size:1.5rem;font-weight:700;letter-spacing:.2em;text-indent:.2em;color:var(--primary)}
.site-omikuji-rank.daikichi{color:#c8a514}
.site-omikuji-rank.kyo{color:#b3261e}
.site-omikuji-msg{display:block;margin-top:4px;font-size:.8rem;color:var(--muted-foreground,#6b7280)}
.stat-row:last-child{border-bottom:none}
.stat-row span:last-child{color:var(--primary);font-weight:700;font-variant-numeric:tabular-nums}

/* 設定ページ */
.setting-row{padding:16px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row label{display:block;font-weight:500;margin-bottom:8px;font-size:.95rem}
.setting-row .desc{font-size:.82rem;color:var(--text-muted);margin-bottom:10px}
select,input[type=range],input[type=color]{
  font-family:inherit;font-size:.9rem;
  background:var(--surface-2);color:var(--text);
  border:1px solid var(--border);border-radius:4px;padding:7px 10px;outline:none;
}
input[type=range]{padding:0;height:6px;width:200px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer}
input[type=color]{padding:2px;width:46px;height:36px;cursor:pointer}

.btn{
  display:inline-block;background:var(--primary);color:#fff;border:none;
  padding:8px 18px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:500;
}
.btn:hover{background:var(--primary-hover);text-decoration:none;color:#fff}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.ghost:hover{background:var(--primary);color:#fff}

/* フッター */
footer{background:var(--surface);border-top:1px solid var(--border);margin-top:40px}
.footer-inner{max-width:1180px;margin:0 auto;padding:30px 20px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
.footer-inner h4{font-size:.85rem;margin:0 0 10px;color:var(--text);font-family:'Noto Sans JP','Noto Color Emoji',sans-serif}
.footer-inner ul{list-style:none;margin:0;padding:0;font-size:.82rem}
.footer-inner li{padding:3px 0}
.footer-inner a{color:var(--text-muted)}
.footer-copy{border-top:1px solid var(--border);padding:14px 20px;text-align:center;font-size:.78rem;color:var(--text-muted)}
@media(max-width:700px){.footer-inner{grid-template-columns:1fr 1fr}}

/* ゲーム中は装飾アニメを停止して描画負荷を下げる */
body.gaming .ticker-move,body.gaming .live-badge::before,body.gaming .notif-btn .notif-ico{animation:none!important}
body.gaming #bg-image-layer,body.gaming .pixel-clock{will-change:auto}
body.gaming main,body.gaming footer,body.gaming .site-header{content-visibility:auto}

/* ゲームモーダル（情報サイト風に控えめに） */
#game-modal{display:none;position:fixed;inset:0;background:rgba(8,10,16,.94);backdrop-filter:blur(10px);z-index:1000;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:0}
.gm-shell{width:100%;max-width:1180px;height:min(88vh,900px);background:#0f1420;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
.gm-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#1a2030,#141926);border-bottom:1px solid rgba(255,255,255,.06)}
#game-modal.fs-active .gm-bar{display:none}
.gm-title{flex:1;min-width:0;color:#fff;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.gm-title .gm-logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.gm-title .gm-logo svg{width:14px;height:14px;fill:#fff}
.gm-actions{display:flex;gap:6px;align-items:center}
.gm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#e5e7eb;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600;transition:background .15s,transform .15s,color .15s}
.gm-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.gm-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gm-btn.gm-primary{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:transparent;color:#fff;padding:0 14px}
.gm-btn.gm-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(124,58,237,.7)}
.gm-btn.gm-close{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.25)}
.gm-btn.gm-close:hover{background:#dc2626;color:#fff}
.gm-body{flex:1;position:relative;background:#000;display:flex;contain:layout paint size}
.gm-body iframe{flex:1;width:100%;height:100%;border:0;display:block;background:#000}
#game-modal:fullscreen,.gm-shell:fullscreen{width:100vw;height:100vh;max-width:none;border-radius:0;padding:0}
.gm-fps{
  position:absolute;top:10px;left:10px;z-index:5;pointer-events:none;
  font-family:'Press Start 2P','Courier New',monospace;font-size:.62rem;line-height:1.6;
  color:#7CFC00;background:rgba(0,0,0,.55);border:1px solid rgba(124,252,0,.35);
  border-radius:8px;padding:6px 9px;letter-spacing:1px;font-variant-numeric:tabular-nums;
  text-shadow:0 0 6px rgba(124,252,0,.55);white-space:pre;
}
.gm-fps.warn{color:#fbbf24;border-color:rgba(251,191,36,.4);text-shadow:0 0 6px rgba(251,191,36,.5)}
.gm-fps.bad{color:#f87171;border-color:rgba(248,113,113,.4);text-shadow:0 0 6px rgba(248,113,113,.5)}
.gm-fps.hidden{display:none}
@media(max-width:640px){
  #game-modal{padding:0}
  .gm-shell{height:100vh;max-width:100%;border-radius:0}
  .gm-btn .gm-lbl{display:none}
  .gm-btn{padding:0;width:36px}
  .gm-btn.gm-primary{padding:0;width:36px}
}
/* News modal */
#news-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1100;justify-content:center;align-items:flex-start;padding:40px 16px;overflow:hidden;backdrop-filter:blur(4px)}
#news-modal.open{display:flex}
.nm-panel{background:var(--surface);color:var(--text);max-width:680px;width:100%;max-height:calc(100vh - 80px);border-radius:14px;padding:0;position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
#news-modal-body{overflow-y:auto;flex:1;min-height:0}
.nm-close{position:absolute;right:10px;top:10px;z-index:5;background:rgba(0,0,0,.55);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nm-close:hover{background:rgba(0,0,0,.8)}
.nm-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--primary),var(--accent));overflow:hidden}
.nm-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.nm-src{display:inline-block;background:var(--primary);color:var(--primary-foreground,#fff);font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:4px;margin:16px 20px 0}
.nm-title{font-family:'Noto Serif JP',serif;font-size:1.35rem;font-weight:700;line-height:1.4;margin:10px 20px 6px}
.nm-date{font-size:.78rem;color:var(--text-muted);margin:0 20px 14px;font-variant-numeric:tabular-nums}
.nm-desc{font-size:.94rem;line-height:1.75;color:var(--text);margin:0 20px 18px;white-space:pre-wrap}
.nm-link{display:inline-block;margin:0 20px 22px;padding:9px 16px;background:var(--primary);color:#fff;border-radius:6px;font-size:.85rem;font-weight:600;text-decoration:none}
.nm-link:hover{opacity:.9}
@media(max-width:600px){.nm-title{font-size:1.1rem}.nm-desc{font-size:.88rem}}
#game-frame{width:100%;height:100%;background:#000;border:none;display:block}

/* テキストユーティリティ */
.muted{color:var(--text-muted)}
.center{text-align:center}
.page{display:none}
.page.active{display:block}

/* ───── ニュースフィード（画像付きカード） ───── */
.news-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.news-card{
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;transition:.2s;color:var(--text);
}
.news-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -16px color-mix(in oklab,var(--primary) 55%,transparent);border-color:color-mix(in oklab,var(--primary) 45%,var(--border));text-decoration:none}
.news-card .nc-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--primary),var(--accent));overflow:hidden;position:relative}
.news-card .nc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.news-card .nc-src{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:4px}
.news-card .nc-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.news-card .nc-title{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:.92rem;line-height:1.4;margin:0}
.news-card .nc-desc{font-size:.8rem;color:var(--text-muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-card .nc-date{font-size:.72rem;color:var(--text-muted);margin-top:auto;font-variant-numeric:tabular-nums}

/* ───── 天気ページ ───── */
.wx-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.wx-loc{font-weight:700;font-size:1.15rem}
.wx-loc small{color:var(--text-muted);font-weight:500;font-size:.78rem;margin-left:8px}
.wx-actions{display:flex;gap:8px;flex-wrap:wrap}
.wx-actions a,.wx-actions button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:.82rem;text-decoration:none;cursor:pointer;font-weight:600}
.wx-actions a:hover,.wx-actions button:hover{border-color:var(--primary);color:var(--primary)}
.wx-today{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:16px;background:var(--surface-2);border-radius:12px;border:1px solid var(--border);margin-bottom:16px}
.wx-tomorrow{border-style:dashed;opacity:.92}
.wx-tomorrow .icon{color:var(--text-muted)}
.wx-today .icon{font-size:3.8rem;line-height:1;display:flex;align-items:center;color:var(--primary)}
.wx-today .icon svg{width:3.4rem;height:3.4rem}
.wx-week .i svg{width:2.2rem;height:2.2rem;color:var(--primary)}
.wx-week .i{display:flex;justify-content:center}
.wx-today .txt h3{margin:0 0 4px;font-size:1.05rem}
.wx-today .txt p{margin:0;color:var(--text-muted);font-size:.88rem;line-height:1.6}
.wx-today .temps{margin-top:6px;font-size:.95rem}
.wx-today .temps .hi{color:#e11d48;font-weight:700;margin-right:10px}
.wx-today .temps .lo{color:#2563eb;font-weight:700}
.wx-week{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.wx-day{padding:12px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);text-align:center}
.wx-day .d{font-size:.78rem;color:var(--text-muted);font-weight:600}
.wx-day .i{font-size:2rem;margin:6px 0;line-height:1}
.wx-day .t{font-size:.85rem}
.wx-day .t .hi{color:#e11d48;font-weight:700}
.wx-day .t .lo{color:#2563eb;font-weight:700;margin-left:6px}
.wx-day .p{font-size:.7rem;color:#0284c7;margin-top:2px}
.wx-empty{padding:24px;text-align:center;color:var(--text-muted)}
/* ===== 気象警報（警戒レベル） ===== */
.wx-alert{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);margin-bottom:16px}
.wx-alert .lv{flex:0 0 auto;min-width:74px;text-align:center;border-radius:10px;padding:8px 6px;color:#fff;font-weight:800;line-height:1.15}
.wx-alert .lv small{display:block;font-size:.6rem;font-weight:700;opacity:.9}
.wx-alert .lv b{font-size:1.5rem;display:block}
.wx-alert.lv1 .lv{background:#3f8f5e}
.wx-alert.lv2 .lv{background:#f2c53d;color:#2b2000}
.wx-alert.lv3 .lv{background:#ef7d1a}
.wx-alert.lv4 .lv{background:#d7182a}
.wx-alert.lv5 .lv{background:#0f0f14;box-shadow:0 0 0 2px #b0179c inset}
.wx-alert.lv4,.wx-alert.lv5{border-color:#d7182a;animation:wxAlertPulse 1.8s ease-in-out infinite}
@keyframes wxAlertPulse{0%,100%{box-shadow:0 0 0 0 rgba(215,24,42,.35)}50%{box-shadow:0 0 0 7px rgba(215,24,42,0)}}
.wx-alert .txt{min-width:0}
.wx-alert .txt h3{margin:0 0 4px;font-size:1rem}
.wx-alert .txt p{margin:0;color:var(--text-muted);font-size:.84rem;line-height:1.6}
.wx-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wx-chip{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}
.wx-chip.warn{background:#fde68a;color:#7c2d12;border-color:#f59e0b}
.wx-chip.emg{background:#0f0f14;color:#ffb3f0;border-color:#b0179c}
.wx-chip.note{background:#e0f2fe;color:#075985;border-color:#38bdf8}
/* ===== 位置情報の許可ダイアログ ===== */
.geo-ov{position:fixed;inset:0;background:rgba(8,12,20,.62);backdrop-filter:blur(3px);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}
.geo-ov.show{display:flex}
.geo-card{max-width:400px;width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 24px 60px -24px rgba(0,0,0,.7);text-align:center}
.geo-card h3{margin:0 0 8px;font-size:1.1rem}
.geo-card p{margin:0 0 16px;font-size:.86rem;color:var(--text-muted);line-height:1.7}
.geo-card .geo-ic{font-size:2.4rem;line-height:1}
.geo-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.geo-btns button{padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:700;cursor:pointer}
.geo-btns button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.geo-note{margin-top:12px;font-size:.72rem;color:var(--text-muted)}

/* LIVEインジケーター */
.live-badge{display:inline-flex;align-items:center;gap:5px;background:#dc2626;color:#fff;font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:4px;margin-left:8px;vertical-align:middle}
.live-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:livepulse 1.2s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}

.theme-toggle-btn{display:inline-flex;align-items:center;justify-content:center;gap:0;color:var(--text)}
.theme-toggle-btn .theme-icon{display:none;width:20px;height:20px}
.theme-toggle-btn .theme-icon-moon{display:block}
body.dark-mode .theme-toggle-btn .theme-icon-moon{display:none}
body.dark-mode .theme-toggle-btn .theme-icon-sun{display:block}

/* --- Link tag chips &amp; badges --- */
:root{--warning:oklch(.52 .19 20);--warning-ink:oklch(1 0 0);--warning-overlay:oklch(.15 0 0 / .65);--warning-shadow:0 24px 80px oklch(.15 0 0 / .3)}
.r18-modal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:var(--warning-overlay);backdrop-filter:blur(8px);padding:20px}
.r18-modal.open{display:flex}
.r18-box{background:var(--surface);color:var(--text);border:1px solid var(--border);border-top:4px solid var(--warning);border-radius:8px;max-width:420px;width:100%;padding:32px 26px 26px;text-align:center;box-shadow:var(--warning-shadow);animation:r18Enter .2s ease-out}
.r18-badge{font-family:'Noto Sans JP',sans-serif;display:block;color:var(--warning);font-size:4rem;line-height:1.1;font-weight:900;letter-spacing:0;margin:0 0 20px}
.r18-box p{margin:0 0 26px;line-height:1.85;font-size:.94rem;font-weight:500;text-wrap:balance}

/* ============================================================
   全デバイス対応の調整（後から追記した上書きスタイル）
   - SVGアイコンがタブレットで小さくなりすぎる問題の修正
   - タッチ端末でもホバー系アニメーションが見えるように
   ============================================================ */

/* ── SVGアイコンを画面幅に応じてスケール ── */
.game-card .play-badge{width:clamp(54px,8vw,74px);height:clamp(54px,8vw,74px)}
.game-card .play-badge svg{width:clamp(24px,3.4vw,32px);height:clamp(24px,3.4vw,32px)}
.gm-title .gm-logo{width:clamp(28px,3.4vw,36px);height:clamp(28px,3.4vw,36px)}
.gm-title .gm-logo svg{width:clamp(16px,2.2vw,22px);height:clamp(16px,2.2vw,22px)}
.gm-btn{height:clamp(38px,4.6vw,46px);min-width:clamp(38px,4.6vw,46px)}
.gm-btn svg{width:clamp(18px,2.4vw,24px);height:clamp(18px,2.4vw,24px)}
.icon-btn{width:clamp(38px,4.6vw,44px);height:clamp(38px,4.6vw,44px);font-size:clamp(1rem,1.8vw,1.15rem)}
.icon-btn svg,.notif-btn svg,.notif-btn .notif-ico,.theme-icon{
  width:clamp(22px,2.8vw,28px);height:clamp(22px,2.8vw,28px)
}

/* ── タブレット帯（601〜1024px）でアイコンが潰れないよう下限を確保 ── */
@media (min-width:601px) and (max-width:1024px){
  .icon-btn{width:44px;height:44px}
  .icon-btn svg,.notif-btn svg,.notif-btn .notif-ico,.theme-icon{width:26px;height:26px}
  .gm-btn{height:44px;min-width:44px}
  .gm-btn svg{width:22px;height:22px}
  .gm-title .gm-logo{width:34px;height:34px}
  .gm-title .gm-logo svg{width:20px;height:20px}
  .game-card .play-badge{width:66px;height:66px}
  .game-card .play-badge svg{width:30px;height:30px}
  .game-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}

/* ── ヒーローの装飾アニメーションを全デバイスで表示 ── */

  display:block !important;
  animation:decoFloat 9s ease-in-out infinite;
}

  0%,100%{transform:translateY(0) rotate(0deg);opacity:.9}
  50%{transform:translateY(-8px) rotate(1.5deg);opacity:1}
}

}

  #home-page .home-hero-deco{min-height:72px}
}

/* ── タッチ端末（ホバー不可）でもアニメーションが見える ── */
@keyframes playPulseTouch{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.9}
  50%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
}
@keyframes kenburnsTouch{
  0%{transform:scale(1)}
  100%{transform:scale(1.07)}
}
@media (hover:none),(pointer:coarse){
  .game-card .play-badge{
    opacity:.92;
    transform:translate(-50%,-50%) scale(1);
    animation:playPulseTouch 2.4s ease-in-out infinite;
  }
  .cg-hero-card img{animation:kenburnsTouch 12s ease-in-out infinite alternate}
  .game-card:active .thumb img{transform:scale(1.08)}

}

#calendar-page .calendar-item-title {font-weight:700;font-size:.84rem;line-height:1.5}
#calendar-page .calendar-item-meta {display:block;color:var(--text-muted);font-size:.7rem}
#calendar-page .calendar-item button {flex:0 0 auto;display:grid;place-items:center;width:29px;height:29px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text-muted);font-size:.92rem;cursor:pointer}

#calendar-page .calendar-empty {padding:22px 4px;color:var(--text-muted);text-align:center;font-size:.85rem}
#calendar-page .calendar-side {min-width:0}
#calendar-page .calendar-actions {display:flex;gap:7px;flex-wrap:wrap}
#calendar-page .calendar-actions button {padding:0 10px;font-size:.74rem}
#calendar-page .calendar-upcoming {display:grid;gap:0;margin-top:12px}

#calendar-page .calendar-search {margin-top:12px}

// タイムアウト付きfetch（応答のない経路でいつまでも待たされないようにする）
async function fetchTimeout(url, ms, opts){
  const ctrl = new AbortController();
  const id = setTimeout(()=&gt;ctrl.abort(), ms);
  try{
    return await fetch(url, { ...(opts||{}), signal: ctrl.signal });
  } finally {
    clearTimeout(id);
  }
}

let CLOCK_FORMAT = '24';
function changeClockFormat(v){

function renderClock(){
  const el = document.getElementById('clock');
  if(!el) return;
  const pad = n =&gt; String(n).padStart(2,'0');
  const d = new Date();
  let h = d.getHours();
  const m = pad(d.getMinutes());
  const sec = pad(d.getSeconds());
  if(CLOCK_FORMAT === 'ampm'){
    const suf = h &gt;= 12 ? 'PM' : 'AM';
    let hh = h % 12; if(hh === 0) hh = 12;
    el.textContent = `${pad(hh)}:${m}:${sec} ${suf}`;
  } else {
    el.textContent = `${pad(h)}:${m}:${sec}`;
  }
}

const NOTIF_KEY = 'nakayosi_notif_lastseen_v1';
function getLastSeen(){ try{ return localStorage.getItem(NOTIF_KEY) || ''; }catch(e){ return ''; } }

function renderNotif(){
  const list = document.getElementById('notifList');

// 設定（localStorageに保存）
const SETTINGS_KEY = 'nakayosi_settings_v1';
function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }catch(e){ return {}; }
}
function saveSettings(patch){
  const s = Object.assign(loadSettings(), patch);
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}
function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const nkys = document.getElementById('search-app');
  if(nkys) nkys.setAttribute('data-theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
  saveSettings({ dark: document.body.classList.contains('dark-mode') });
}
function changePrimaryColor(c){
  document.documentElement.style.setProperty('--primary',c);
  saveSettings({ primary: c });
}
function resetPrimaryColor(){
  const c = document.body.classList.contains('dark-mode') ? '#5aa9ff' : '#0b5fa5';
  changePrimaryColor(c);
  document.getElementById('primary-color-picker').value = c;
}
function changeFontSize(s){
  document.body.style.fontSize = s+'px';
  saveSettings({ fontSize: s });
}
function changeFont(f){
  document.body.style.fontFamily = f;
  saveSettings({ font: f });
}
function changeBackgroundPattern(p){
  const b = document.body.style;
  if(p==='none'){ b.backgroundImage='none'; }
  else if(p==='dots'){ b.backgroundImage='radial-gradient(var(--text-muted) 1px,transparent 1px)'; b.backgroundSize='25px 25px'; }
  else { b.backgroundImage='linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px)'; b.backgroundSize='30px 30px'; }
  saveSettings({ bg: p });
}
function applySavedSettings(){
  const s = loadSettings();
  if(s.dark) document.body.classList.add('dark-mode');
  if(s.primary){
    document.documentElement.style.setProperty('--primary', s.primary);
    const p = document.getElementById('primary-color-picker'); if(p) p.value = s.primary;
  }
  if(s.fontSize){
    document.body.style.fontSize = s.fontSize+'px';
    const r = document.querySelector('input[type=range]'); if(r) r.value = s.fontSize;
  }
  if(s.bg){
    changeBackgroundPattern(s.bg);
    const sel = document.querySelector('#settings-page select:not(#font-select)'); if(sel) sel.value = s.bg;
  }
  if(s.clockFormat){
    CLOCK_FORMAT = s.clockFormat;
    const cf = document.getElementById('clock-format-select'); if(cf) cf.value = s.clockFormat;
    renderClock();
  }
  if(s.font){
    document.body.style.fontFamily = s.font;
    const fs = document.getElementById('font-select'); if(fs) fs.value = s.font;
  }
  // 背景画像
  if(s.bgImage){
    applyBgImage(s.bgImage, s.bgFixed !== false, s.bgOpacity || 100);
    const op = document.getElementById('bg-image-opacity'); if(op) op.value = s.bgOpacity || 100;
    const opv = document.getElementById('bg-image-opacity-val'); if(opv) opv.textContent = (s.bgOpacity || 100)+'%';
    const fx = document.getElementById('bg-image-fixed'); if(fx) fx.checked = s.bgFixed !== false;
    const pv = document.getElementById('bg-image-preview');
    if(pv) pv.innerHTML = `&lt;img loading="lazy" decoding="async" src="${s.bgImage}" alt="背景プレビュー" style="max-width:220px;max-height:130px;border-radius:8px;border:1px solid var(--border)"&gt;`;
  }
  if(s.disguise){
    const d = document.getElementById('disguise-select'); if(d) d.value = s.disguise;
    applyDisguise(s.disguise);
  }
}

// ================= 偽装モード =================
const DISGUISE_PRESETS = {
  off:        { title: null, favicon: null },
  google:     { title: 'Google',            favicon: 'https://www.google.com/favicon.ico' },
  gtranslate: { title: 'Google 翻訳',        favicon: 'https://translate.google.com/favicon.ico' },
  classroom:  { title: 'ホーム - Classroom', favicon: 'https://ssl.gstatic.com/classroom/favicon.png' }
};
let ORIGINAL_TITLE = document.title;
function setFavicon(href){
  let link = document.querySelector('link[rel="icon"]');
  if(!link){ link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
  if(href){ link.href = href; link.type = ''; }
  else { link.href = '/site-icon.png'; link.type = 'image/png'; }
}
function applyDisguise(mode){
  const p = DISGUISE_PRESETS[mode] || DISGUISE_PRESETS.off;
  if(p.title){ document.title = p.title; setFavicon(p.favicon); }
  else { document.title = ORIGINAL_TITLE; setFavicon(null); }
  const activePage = document.querySelector('.page.active');
  if(parent !== window &amp;&amp; typeof parent.updatePageTitle === 'function') parent.updatePageTitle(activePage ? activePage.id.replace(/-page$/, '') : 'home');
}
function changeDisguise(mode){
  saveSettings({ disguise: mode });
  applyDisguise(mode);
}

// ================= 背景画像（GIF対応） =================
function applyBgImage(dataUrl, fixed, opacity){
  let layer = document.getElementById('bg-image-layer');
  if(!layer){
    layer = document.createElement('div');
    layer.id = 'bg-image-layer';
    layer.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:no-repeat;background-size:cover;background-position:center;';
    document.body.appendChild(layer);
  }
  layer.style.backgroundImage = `url("${dataUrl}")`;
  layer.style.backgroundAttachment = fixed ? 'fixed' : 'scroll';
  layer.style.opacity = (opacity/100).toFixed(2);
}
function removeBgImageLayer(){
  const layer = document.getElementById('bg-image-layer');
  if(layer) layer.remove();
}
function onBgImageSelected(e){
  const file = e.target.files &amp;&amp; e.target.files[0];
  if(!file) return;
  if(file.size &gt; 6 * 1024 * 1024){
    alert('画像が大きすぎます（6MB以下にしてください）');
    return;
  }
  const reader = new FileReader();
  reader.onload = () =&gt; {
    const dataUrl = reader.result;
    const s = loadSettings();
    const fixed = s.bgFixed !== false;
    const opacity = s.bgOpacity || 100;
    try {
      saveSettings({ bgImage: dataUrl, bgFixed: fixed, bgOpacity: opacity });
    } catch(err){
      alert('この画像は保存領域に収まりません。もう少し小さな画像をお試しください。');
      return;
    }
    applyBgImage(dataUrl, fixed, opacity);
    const pv = document.getElementById('bg-image-preview');

// ゲームモーダル
// ===== FPSメーター（実測値：rAFのフレーム間隔を計測）=====
const GM_FPS = { raf:0, last:0, frames:0, acc:0, min:Infinity, worst:0 };
function gmFpsLoop(ts){
  const el = document.getElementById('gmFps');
  if(!el){ GM_FPS.raf = 0; return; }
  if(GM_FPS.last){
    const dt = ts - GM_FPS.last;
    GM_FPS.frames++; GM_FPS.acc += dt;
    if(dt &gt; GM_FPS.worst) GM_FPS.worst = dt;
    if(GM_FPS.acc &gt;= 500){
      const fps = Math.round((GM_FPS.frames * 1000) / GM_FPS.acc);
      const minFps = Math.max(1, Math.round(1000 / GM_FPS.worst));
      if(fps &lt; GM_FPS.min) GM_FPS.min = fps;
      el.textContent = `FPS ${String(fps).padStart(3,' ')}\n${GM_FPS.worst.toFixed(1)}ms / min ${minFps}`;
      el.classList.toggle('warn', fps &lt; 50 &amp;&amp; fps &gt;= 30);
      el.classList.toggle('bad', fps &lt; 30);
      GM_FPS.frames = 0; GM_FPS.acc = 0; GM_FPS.worst = 0;
    }
  }
  GM_FPS.last = ts;
  GM_FPS.raf = requestAnimationFrame(gmFpsLoop);
}
function startFps(){
  const el = document.getElementById('gmFps');
  if(el){ el.classList.remove('hidden'); el.textContent = 'FPS --'; }
  GM_FPS.last = 0; GM_FPS.frames = 0; GM_FPS.acc = 0; GM_FPS.worst = 0; GM_FPS.min = Infinity;
  if(!GM_FPS.raf) GM_FPS.raf = requestAnimationFrame(gmFpsLoop);
}
function stopFps(){
  if(GM_FPS.raf) cancelAnimationFrame(GM_FPS.raf);
  GM_FPS.raf = 0;
}
function toggleFps(){
  const el = document.getElementById('gmFps');
  if(el) el.classList.toggle('hidden');
}

function openGame(url, name){
  const modal = document.getElementById('game-modal');

function wxIcon(code){
  const c = String(code||'');
  let k = 'part';
  if(/^1|^123|^124|^125|^126|^127|^128/.test(c)) k='sun';
  else if(/^2|^223|^231/.test(c)) k='cloud';
  else if(/^3|^313|^314|^315|^316|^317/.test(c)) k='rain';
  else if(/^4|^40[0-9]|^41[0-4]/.test(c)) k='snow';
  else if(/^5|^6|^7/.test(c)) k='storm';
  return wxSvg(WX_SVG[k]);
}

async function fetchWxAreas(pref){
  // 気象庁エリアAPIから該当officeの子エリア取得
  try{
    const office = JMA_OFFICES[pref]; if(!office) return [];
    const res = await fetch('https://www.jma.go.jp/bosai/common/const/area.json');
    const data = await res.json();
    const class10s = data.class10s || {};
    const offices = data.offices || {};
    const targetOffice = offices[office];
    if(!targetOffice) return [];
    // office → class10s の children
    const children = Object.entries(class10s).filter(([code,v]) =&gt; v.parent === office);
    return children.map(([code,v]) =&gt; ({ code, name: v.name }));
  }catch(e){ return []; }
}

async function fetchWeather(force){
  const locEl = document.getElementById('wxLoc');

  const weekEl = document.getElementById('wxWeek');
  const yahoo = document.getElementById('wxYahooLink');
  if(typeof fetchWxWarnings === 'function') fetchWxWarnings();
  if(!WX_PREF){
    if(locEl) locEl.innerHTML = '地域が未設定です &lt;small&gt;「設定」から都道府県を選んでください&lt;/small&gt;';
    if(todayEl) todayEl.innerHTML = '&lt;div class="wx-empty"&gt;「設定」ページの「📍天気の地域」で都道府県を選ぶと、ここに天気が表示されます。&lt;/div&gt;';
    if(weekEl) weekEl.innerHTML = '';

  }
  if(yahoo){
    // Yahoo!天気のトップから該当都道府県ページへ
    yahoo.href = 'https://weather.yahoo.co.jp/weather/search/?p=' + encodeURIComponent(WX_TOWNS.find(t =&gt; t.code === WX_TOWN)?.name || (WX_TOWN === WX_DEFAULT.wxTown ? '東大阪市' : WX_PREF));
  }
  const office = JMA_OFFICES[WX_PREF];
  try{
    const res = await fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${office}.json?_=${Date.now()}`, { cache:'no-store' });
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    // data[0] は短期予報（today/tomorrow）、data[1] は週間
    const short = data[0];
    const weekly = data[1];
    // 選択したエリアを探す。未指定なら先頭。
    const weatherAreas = short.timeSeries[0].areas;
    let idx = 0;
    if(WX_CITY){
      const i = weatherAreas.findIndex(a =&gt; a.area.code === WX_CITY);
      if(i &gt;= 0) idx = i;
    }
    const areaName = weatherAreas[idx].area.name;
    const areaCode = weatherAreas[idx].area.code;
    const weathers = weatherAreas[idx].weathers || [];
    const codes = weatherAreas[idx].weatherCodes || [];
    const times = short.timeSeries[0].timeDefines || [];
    // 気温（短期）

    if(short.timeSeries[2]){
      const tempAreas = short.timeSeries[2].areas;
      const t = tempAreas[0]; // 代表気温観測点

      lo = temps[0]!=='' ? temps[0] : null;
      hi = temps[1]!=='' ? temps[1] : null;
    }
    if(locEl){
      const townName = WX_TOWNS.find(t =&gt; t.code === WX_TOWN)?.name || (WX_TOWN === WX_DEFAULT.wxTown ? '東大阪市' : '');
      locEl.innerHTML = `${safeText(WX_PREF)} ${safeText(townName)} &lt;small&gt;${safeText(areaName)}の予報&lt;/small&gt;`;
    }
    if(todayEl){
      const today = weathers[0] || '—';
      const todayCode = codes[0];
      // 明日の天気（timeSeries[0]の2件目 = 翌日分。無い/空の場合は週間予報から補完）
      let tmrwText = weathers[1] || '';
      let tmrwCode = codes[1] || '';
      let tmrwDate = times[1] ? new Date(times[1]) : null;
      let tHi = null, tLo = null;
      if(weekly &amp;&amp; weekly.timeSeries[0]){
        const wArea0 = weekly.timeSeries[0].areas[0];
        const wTimes0 = weekly.timeSeries[0].timeDefines || [];
        const wTempArea0 = weekly.timeSeries[1] ? weekly.timeSeries[1].areas[0] : null;
        const wMax0 = wTempArea0?.tempsMax || [];
        const wMin0 = wTempArea0?.tempsMin || [];
        const targetDate = (tmrwDate || new Date(Date.now()+86400000)).toDateString();
        let wi = wTimes0.findIndex(t =&gt; new Date(t).toDateString() === targetDate);
        if(wi &lt; 0) wi = 0; // 見つからなければ週間予報の先頭（通常は明日）を使う
        if(!tmrwCode &amp;&amp; wArea0.weatherCodes) tmrwCode = wArea0.weatherCodes[wi] || '';
        if(wMax0[wi] &amp;&amp; wMax0[wi] !== '') tHi = wMax0[wi];
        if(wMin0[wi] &amp;&amp; wMin0[wi] !== '') tLo = wMin0[wi];
        if(!tmrwDate &amp;&amp; wTimes0[wi]) tmrwDate = new Date(wTimes0[wi]);
      }
      if(!tmrwDate) tmrwDate = new Date(Date.now()+86400000);
      todayEl.innerHTML = `&lt;div class="wx-today"&gt;
        &lt;div class="icon"&gt;${wxIcon(todayCode)}&lt;/div&gt;
        &lt;div class="txt"&gt;
          &lt;h3&gt;今日の天気（${new Date(times[0]||Date.now()).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'})}）&lt;/h3&gt;
          &lt;p&gt;${today.replace(/\u3000/g,' ')}&lt;/p&gt;
          &lt;div class="temps"&gt;
            ${hi!=null?`&lt;span class="hi"&gt;最高 ${hi}℃&lt;/span&gt;`:''}
            ${lo!=null?`&lt;span class="lo"&gt;最低 ${lo}℃&lt;/span&gt;`:''}
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class="wx-today wx-tomorrow"&gt;
        &lt;div class="icon"&gt;${wxIcon(tmrwCode)}&lt;/div&gt;
        &lt;div class="txt"&gt;
          &lt;h3&gt;明日の天気（${tmrwDate.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'})}）&lt;/h3&gt;
          &lt;p&gt;${(tmrwText||'—').toString().replace(/\u3000/g,' ')}&lt;/p&gt;
          &lt;div class="temps"&gt;
            ${tHi!=null?`&lt;span class="hi"&gt;最高 ${tHi}℃&lt;/span&gt;`:''}
            ${tLo!=null?`&lt;span class="lo"&gt;最低 ${tLo}℃&lt;/span&gt;`:''}
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;`;
    }
    // 週間予報
    if(weekEl &amp;&amp; weekly){
      const wArea = weekly.timeSeries[0].areas[0];
      const wTimes = weekly.timeSeries[0].timeDefines || [];
      const wCodes = wArea.weatherCodes || [];
      const wPops = wArea.pops || [];
      const wTemp = weekly.timeSeries[1] ? weekly.timeSeries[1].areas[0] : null;
      const wMax = wTemp?.tempsMax || [];
      const wMin = wTemp?.tempsMin || [];
      weekEl.innerHTML = wTimes.map((tstr,i)=&gt;{
        const d = new Date(tstr);

        return `&lt;div class="wx-day"&gt;

          &lt;/div&gt;
          ${wPops[i]?`&lt;div class="p"&gt;☂ ${wPops[i]}%&lt;/div&gt;`:''}
        &lt;/div&gt;`;
      }).join('');
    }
  }catch(e){
    if(todayEl) todayEl.innerHTML = '&lt;div class="wx-empty"&gt;天気情報を取得できませんでした。時間をおいて再度お試しください。&lt;/div&gt;';
    if(weekEl) weekEl.innerHTML = '';
  }
}

async function loadJmaAreaData(){

// class10（地域）配下の市区町村（class20）一覧
async function fetchWxTowns(class10){
  const data = await loadJmaAreaData();
  if(!data || !class10) return [];
  const class15s = data.class15s || {};
  const class20s = data.class20s || {};
  const mid = Object.keys(class15s).filter(c =&gt; class15s[c].parent === class10);
  const towns = [];
  Object.keys(class20s).forEach(code =&gt; {
    if(mid.includes(class20s[code].parent)) towns.push({ code, name: class20s[code].name });
  });
  return towns;
}
