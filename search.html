<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NKYSɪɴ 検索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://serpapi.com">
    <link rel="preconnect" href="https://api.allorigins.win">
    <link rel="preconnect" href="https://corsproxy.io">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f6f8;
            --card-bg: #ffffff;
            --input-bg: #eef3f9;
            --text-color: #1a1a1a;
            --text-muted: #6b7280;
            --accent-blue: #0b5fa5;
            --border-color: #e3e6eb;
            --border-radius: 8px;
            --live-red: #c0392b;
        }

        [data-theme="dark"] {
            --bg-color: #0f1015;
            --card-bg: #1e1f26;
            --input-bg: #2a2b36;
            --text-color: #e8eaed;
            --text-muted: #9aa0a6;
            --accent-blue: #4285f4;
            --border-color: #3c4043;
            --live-red: #ea4335;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .svg-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            color: var(--text-muted);
        }

        .top-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            background: none;
            border: none;
            font-size: 14px;
        }

        .top-btn:hover { color: var(--accent-blue); }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .container.results-mode {
            justify-content: flex-start;
            align-items: stretch;
            padding: 20px 30px;
        }

        .search-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 680px;
            gap: 20px;
            margin: 0 auto;
        }

        .results-mode .search-header {
            flex-direction: row;
            align-items: center;
            max-width: 100%;
            gap: 25px;
            margin: 0;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-family: 'Pixelify Sans', 'Press Start 2P', monospace;
            font-size: 3.8rem;
            font-weight: 700;
            color: #3b82f6;
            letter-spacing: -1px;
            user-select: none;
        }

        .privacy-badge {
            font-size: 0.85rem;
            color: var(--accent-blue);
            background: rgba(66, 133, 244, 0.15);
            border: 1px solid rgba(66, 133, 244, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .results-mode .privacy-badge { display: none; }
        .results-mode .logo { font-size: 2rem; }

        .search-box-container {
            position: relative;
            width: 100%;
        }

        .results-mode .search-box-container { max-width: 720px; }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px 16px;
        }

        .search-box:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(66, 133, 244, 0.3);
        }

        .search-icon-wrap {
            color: var(--text-muted);
            margin-right: 8px;
            display: flex;
            align-items: center;
        }

        .search-input {
            flex-grow: 1;
            height: 38px;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: 105%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            z-index: 100;
            display: none;
            overflow: hidden;
        }

        .autocomplete-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-color);
        }

        .autocomplete-item:hover {
            background-color: var(--input-bg);
            color: var(--accent-blue);
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: none;
            padding: 4px;
            align-items: center;
            justify-content: center;
        }

        .clear-btn:hover { color: var(--text-color); }

        .search-submit-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .tabs {
            display: none;
            gap: 16px;
            margin-top: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            padding-bottom: 8px;
            overflow-x: auto;
        }

        .results-mode .tabs { display: flex; }

        .tab {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            padding: 6px 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            position: relative;
        }

        .tab.active {
            color: var(--accent-blue);
            font-weight: bold;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-blue);
        }

        .main-content {
            display: flex;
            width: 100%;
            gap: 30px;
            align-items: flex-start;
        }

        .results-wrapper { flex: 1; width: 100%; min-width: 0; }
        #results { width: 100%; }

        .sidebar {
            width: 380px;
            flex-shrink: 0;
            display: none;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .sidebar.active { display: flex; }

        .knowledge-card, .video-detail-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .knowledge-title, .detail-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--text-color);
            line-height: 1.4;
        }

        .knowledge-subtitle, .detail-author {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .knowledge-desc, .detail-desc {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 6px;
        }

        .knowledge-link {
            font-size: 13px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .result-item {
            margin-bottom: 24px;
            max-width: 800px;
            content-visibility: auto;
            contain-intrinsic-size: 80px;
        }

        .result-title { color: var(--accent-blue); font-size: 18px; text-decoration: none; display: inline-block; margin-bottom: 4px; }
        .result-title:hover { text-decoration: underline; }
        .result-url { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; word-break: break-all; }
        .result-snippet { font-size: 14px; line-height: 1.5; opacity: 0.9; }

        .shopping-grid, .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .image-grid {
            column-count: 4;
            column-gap: 16px;
            width: 100%;
        }

        @media (max-width: 1100px) { .image-grid { column-count: 3; } }
        @media (max-width: 768px) { .image-grid { column-count: 2; } }
        @media (max-width: 480px) { .image-grid { column-count: 1; } }

        .image-card {
            break-inside: avoid;
            margin-bottom: 16px;
            background: transparent;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .image-card:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .image-card img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
            background: var(--input-bg);
            display: block;
        }

        .image-card-info {
            padding: 6px 2px 10px 2px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .image-card-title {
            font-size: 13px;
            color: var(--text-color);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .image-card-source {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .image-card-source img {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            object-fit: contain;
        }

        /* 2枚目スクショ参照：画像拡大プレビューモーダル */
        .image-viewer-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #18191c;
            z-index: 2000;
            flex-direction: column;
            overflow-y: auto;
        }

        .image-viewer-modal.active {
            display: flex;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #202124;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .viewer-site-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #e8eaed;
        }

        .viewer-site-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .viewer-btn-icon {
            background: none;
            border: none;
            color: #9aa0a6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }

        .viewer-btn-icon:hover { color: #ffffff; background: #303134; }

        .viewer-main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .viewer-image-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            border-radius: 12px;
            padding: 16px;
            max-height: 65vh;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .viewer-image-container img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 6px;
        }

        .viewer-lens-btn {
            position: absolute;
            bottom: 24px;
            left: 24px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.25);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 5;
        }

        .viewer-lens-btn:hover {
            background: rgba(0,0,0,0.85);
        }

        .viewer-details-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 16px;
        }

        .viewer-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            flex: 1;
            line-height: 1.4;
        }

        .viewer-visit-btn {
            background: #a8c7fa;
            color: #040c19;
            padding: 10px 22px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .viewer-visit-btn:hover {
            background: #c2e7ff;
        }

        .viewer-action-btns {
            width: 100%;
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .viewer-action-btn {
            flex: 1;
            background: #282a2d;
            color: #e8eaed;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .viewer-action-btn:hover { background: #35373a; }

        .viewer-related-section {
            width: 100%;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }

        .viewer-related-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: 220px;
        }

        .card img { width: 100%; height: 160px; object-fit: cover; background: var(--input-bg); }
        .card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .card-title { font-size: 14px; font-weight: bold; color: var(--accent-blue); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
        .card-meta { font-size: 12px; color: var(--text-muted); }
        .card-price { font-size: 15px; font-weight: bold; color: #e53e3e; }

        .video-card {
            display: flex;
            gap: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: 110px;
            position: relative;
        }

        .video-card-thumb { position: relative; width: 160px; height: 90px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #000; }
        .video-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .video-card-info { display: flex; flex-direction: column; justify-content: center; gap: 6px; }

        .live-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: var(--live-red);
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .sidebar-section-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-blue);
            margin: 14px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shorts-scroll-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .short-item-card {
            flex: 0 0 100px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .short-item-thumb {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #000;
        }

        .short-item-title {
            font-size: 11px;
            padding: 6px;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-color);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .comment-item {
            background: var(--input-bg);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
        }

        .comment-author {
            font-weight: bold;
            color: var(--accent-blue);
            margin-bottom: 2px;
        }

        .comment-content {
            color: var(--text-color);
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }

        .ghost-pulse {
            background: linear-gradient(90deg, var(--card-bg) 25%, var(--input-bg) 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: ghost-shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes ghost-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .ghost-item {
            height: 90px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        .ghost-grid-card {
            height: 220px;
            width: 100%;
            break-inside: avoid;
            margin-bottom: 16px;
        }

        .ghost-sidebar-card {
            height: 180px;
            width: 100%;
            margin-bottom: 15px;
        }

        audio { width: 100%; margin-top: 8px; height: 32px; }
        .infinite-loader { display: none; padding: 20px 0; text-align: center; color: var(--text-muted); font-size: 14px; }
        footer { margin-top: auto; border-top: 1px solid var(--border-color); padding: 12px 20px; text-align: center; font-size: 12px; color: var(--text-muted); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            width: 90%; max-width: 550px;
            padding: 20px; color: var(--text-color);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .close-modal { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .close-modal:hover { color: var(--text-color); }

        .setting-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
        .setting-group label { font-size: 13px; color: var(--text-muted); }
        .setting-input { padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; font-size: 14px; width: 100%; }
        .setting-section-title { font-size: 14px; font-weight: bold; color: var(--accent-blue); margin: 15px 0 8px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .save-btn { background: var(--accent-blue); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 統合SVG定義マップ -->
    <svg style="display:none;">

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header"><span>詳細設定</span><button class="close-modal" onclick="closeSettings()"><svg class="svg-icon"><use href="#icon-close"></use></svg></button></div>
            
            <div class="setting-section-title">基本設定</div>
            <div class="setting-group">
                <label>テーマ設定:</label>
                <select id="settingTheme" class="setting-input">
                    <option value="dark">ダークモード</option>
                    <option value="light">ライトモード</option>
                </select>
            </div>

            <div class="setting-group">
                <label>重複URL/画像の自動除外:</label>
                <select id="settingDeduplicate" class="setting-input">
                    <option value="true">有効 (推奨)</option>
                    <option value="false">無効</option>
                </select>
            </div>

            <div class="setting-section-title">API Keys (SerpApi)</div>
            <div class="setting-group">
                <label>Web検索用 SerpApi Keys (1行に1つまたはカンマ区切り):</label>
                <textarea id="settingSerpKeysWeb" class="setting-input" rows="3" placeholder="APIキー1&#10;APIキー2&#10;APIキー3"></textarea>
            </div>
            <div class="setting-group">
                <label>画像検索用 SerpApi Keys (1行に1つまたはカンマ区切り):</label>
                <textarea id="settingSerpKeysImage" class="setting-input" rows="3" placeholder="APIキー1&#10;APIキー2&#10;APIキー3"></textarea>
            </div>

            <div class="setting-section-title">外部サービス連携</div>
            <div class="setting-group">
                <label>動画 API (Invidious) ノード:</label>
                <input type="text" id="settingOmadaApi" class="setting-input" value="https://yt.omada.cafe">
            </div>

            <div class="setting-group">
                <label>楽天市場 アプリID (Rakuten AppID):</label>
                <input type="text" id="settingRakutenAppId" class="setting-input" value="1018224734614210871">
            </div>

            <button class="save-btn" onclick="saveSettings()">設定を保存</button>
        </div>

    <script>
        let SERPAPI_KEYS_WEB = [];
        let SERPAPI_KEYS_IMAGE = [];

        const searchCache = new Map();

        let currentWebKeyIdx = 0;
        let currentImageKeyIdx = 0;
        let currentQuery = '';
        let currentPage = 1;
        let currentCategory = 'general';
        let isLoading = false;
        let hasMoreResults = true;
        let seenItemsSet = new Set();
        let inputDebounceTimer = null;

        let currentImagesData = [];
        let activeImageIndex = 0;

        (function init() {
            loadSettings();
            window.addEventListener('scroll', handleAutoScroll, { passive: true });
        })();

        function parseKeysFromInput(text) {
            if (!text) return [];
            return text.split(/[\n,]/).map(k => k.trim()).filter(k => k.length > 0);
        }

        function loadSettings() {
            const savedTheme = localStorage.getItem('nkys_search_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('settingTheme').value = savedTheme;

            if (localStorage.getItem('settingDeduplicate') !== null) {
                document.getElementById('settingDeduplicate').value = localStorage.getItem('settingDeduplicate');
            }
            if (localStorage.getItem('settingOmadaApi')) {
                document.getElementById('settingOmadaApi').value = localStorage.getItem('settingOmadaApi');
            }
            if (localStorage.getItem('settingRakutenAppId')) {
                document.getElementById('settingRakutenAppId').value = localStorage.getItem('settingRakutenAppId');
            }

            const rawWebKeys = localStorage.getItem('settingSerpKeysWeb') || '';
            const rawImgKeys = localStorage.getItem('settingSerpKeysImage') || '';
            document.getElementById('settingSerpKeysWeb').value = rawWebKeys;
            document.getElementById('settingSerpKeysImage').value = rawImgKeys;

            SERPAPI_KEYS_WEB = parseKeysFromInput(rawWebKeys);
            SERPAPI_KEYS_IMAGE = parseKeysFromInput(rawImgKeys);
        }

        function saveSettings() {
            const theme = document.getElementById('settingTheme').value;
            localStorage.setItem('nkys_search_theme', theme);
            document.documentElement.setAttribute('data-theme', theme);

            localStorage.setItem('settingDeduplicate', document.getElementById('settingDeduplicate').value);
            localStorage.setItem('settingOmadaApi', document.getElementById('settingOmadaApi').value);
            localStorage.setItem('settingRakutenAppId', document.getElementById('settingRakutenAppId').value);

            const webKeysVal = document.getElementById('settingSerpKeysWeb').value;
            const imgKeysVal = document.getElementById('settingSerpKeysImage').value;
            localStorage.setItem('settingSerpKeysWeb', webKeysVal);
            localStorage.setItem('settingSerpKeysImage', imgKeysVal);

            SERPAPI_KEYS_WEB = parseKeysFromInput(webKeysVal);
            SERPAPI_KEYS_IMAGE = parseKeysFromInput(imgKeysVal);

            closeSettings();
        }

        function onInputSearch() {
            const input = document.getElementById('searchInput').value;
            document.getElementById('clearBtn').style.display = input ? 'flex' : 'none';

            clearTimeout(inputDebounceTimer);
            if (!input.trim()) {
                document.getElementById('autocompleteDropdown').style.display = 'none';
                return;
            }

            inputDebounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://api.duckduckgo.com/ac/?q=${encodeURIComponent(input)}&type=list`);
                    if(res.ok) {
                        const data = await res.json();
                        const suggestions = data[1] || [];
                        if(suggestions.length > 0) {
                            const dropdown = document.getElementById('autocompleteDropdown');
                            dropdown.innerHTML = suggestions.slice(0, 6).map(s => `<div class="autocomplete-item" onclick="selectSuggest('${s}')">${s}</div>`).join('');
                            dropdown.style.display = 'block';
                            return;
                        }
                    }
                } catch(e) {}
                document.getElementById('autocompleteDropdown').style.display = 'none';
            }, 150);
        }

        function selectSuggest(text) {
            document.getElementById('searchInput').value = text;
            document.getElementById('autocompleteDropdown').style.display = 'none';
            handleSearch();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').style.display = 'none';
            document.getElementById('autocompleteDropdown').style.display = 'none';
        }

        function openAbout() { document.getElementById('aboutModal').style.display = 'flex'; }
        function closeAbout() { document.getElementById('aboutModal').style.display = 'none'; }
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function deduplicateResults(items) {
            const isDeduplicateEnabled = document.getElementById('settingDeduplicate').value === 'true';
            if (!isDeduplicateEnabled || !Array.isArray(items)) return items;

            return items.filter(item => {
                const key = item.url || item.img_src || item.videoId || item.previewUrl;
                if (!key) return true;
                if (seenItemsSet.has(key)) return false;
                seenItemsSet.add(key);
                return true;
            });
        }

        function showGhostScreen(type, isNextPage = false) {
            if (isNextPage) return;
            const resultsDiv = document.getElementById('results');
            const sidebar = document.getElementById('sidebar');

            let ghostHtml = '';
            if (type === 'images') {
                ghostHtml = `<div class="image-grid">` + '<div class="ghost-pulse ghost-grid-card"></div>'.repeat(8) + `</div>`;
            } else if (['shopping', 'music'].includes(type)) {
                ghostHtml = `<div class="${type}-grid">` + '<div class="ghost-pulse ghost-grid-card"></div>'.repeat(8) + `</div>`;
            } else {
                ghostHtml = '<div class="ghost-pulse ghost-item"></div>'.repeat(5);
            }
            resultsDiv.innerHTML = ghostHtml;

            if (type === 'videos' || type === 'general' || type === 'news') {
                sidebar.innerHTML = '<div class="ghost-pulse ghost-sidebar-card"></div><div class="ghost-pulse ghost-sidebar-card"></div>';
                sidebar.classList.add('active');
            } else {
                sidebar.classList.remove('active');
            }
        }

        function handleSearch(e) {
            if(e) e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if(!q) return;

            currentQuery = q;
            currentPage = 1;
            hasMoreResults = true;
            seenItemsSet.clear();
            currentImagesData = [];

            document.getElementById('autocompleteDropdown').style.display = 'none';
            document.getElementById('mainContainer').classList.add('results-mode');
            
            showGhostScreen(currentCategory);
            executeSearch();

            if (currentCategory === 'news' || currentCategory === 'general') {
                setTimeout(() => fetchWikipediaKnowledgePanel(currentQuery), 10);
            }
        }

        function changeCategory(cat, evt) {
            if(isLoading || currentCategory === cat) return;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            evt.currentTarget.classList.add('active');

            currentCategory = cat;
            currentPage = 1;
            hasMoreResults = true;
            seenItemsSet.clear();
            currentImagesData = [];

            showGhostScreen(currentCategory);

            if(currentQuery) {
                executeSearch();
                if (currentCategory === 'news' || currentCategory === 'general') {
                    setTimeout(() => fetchWikipediaKnowledgePanel(currentQuery), 10);
                }
            }
        }

        async function executeSearch(isNextPage = false) {
            const cacheKey = `${currentCategory}:${currentQuery}:${currentPage}`;
            
            if (searchCache.has(cacheKey)) {
                const cachedData = searchCache.get(cacheKey);
                renderResults(deduplicateResults(cachedData), isNextPage, currentCategory);
                if (currentCategory === 'videos' && !isNextPage) {
                    fetchSideShorts(currentQuery);
                }
                return;
            }

            isLoading = true;
            if (isNextPage) {
                document.getElementById('infiniteLoader').style.display = 'block';
            }

            let rawResults = [];

            if (currentCategory === 'shopping') {
                rawResults = await fetchRakutenShoppingAPI(currentQuery, currentPage);
            } else if (currentCategory === 'music') {
                rawResults = await fetchITunesMusicAPI(currentQuery);
            } else if (currentCategory === 'images') {
                rawResults = await fetchImageSearch(currentQuery, currentPage);
            } else if (currentCategory === 'news') {
                rawResults = await fetchNewsMultiAPI(currentQuery, currentPage);
            } else if (currentCategory === 'videos') {
                rawResults = await fetchOmadaMedia(currentQuery, currentPage);
            } else {
                rawResults = await fetchFastSerpApiSearch(currentQuery, currentPage);
            }

            if (rawResults.length > 0) {
                searchCache.set(cacheKey, rawResults);
            }

            const results = deduplicateResults(rawResults);

            isLoading = false;
            document.getElementById('infiniteLoader').style.display = 'none';
            renderResults(results, isNextPage, currentCategory);

            if (currentCategory === 'videos' && !isNextPage) {
                fetchSideShorts(currentQuery);
            }
        }

        async function fetchTextWithProxy(targetUrl) {
            const proxyProviders = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            for (const pUrl of proxyProviders) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 4500);
                    const res = await fetch(pUrl, { signal: controller.signal });
                    clearTimeout(timer);

                    if (res.ok) {
                        const text = await res.text();
                        if (text && !text.includes("403 Forbidden")) return text;
                    }
                } catch (e) {}
            }
            return null;
        }

        /* SearXNG (search.lumy.live) 検索API */
        async function fetchSearxngWeb(query, page = 1) {
            const targetUrl = `https://search.lumy.live/search?q=${encodeURIComponent(query)}&format=json&pageno=${page}`;

            try {
                const res = await fetch(targetUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (data.results && data.results.length > 0) {
                        return data.results.map(item => ({
                            title: item.title,
                            url: item.url,
                            content: item.content || ''
                        }));
                    }
                }
            } catch (e) {}

            const rawText = await fetchTextWithProxy(targetUrl);
            if (rawText) {
                try {
                    const data = JSON.parse(rawText);
                    if (data.results && data.results.length > 0) {
                        return data.results.map(item => ({
                            title: item.title,
                            url: item.url,
                            content: item.content || ''
                        }));
                    }
                } catch (e) {}
            }

            return [];
        }

        async function fetchSearxngImages(query, page = 1) {
            const targetUrl = `https://search.lumy.live/search?q=${encodeURIComponent(query)}&categories=images&format=json&pageno=${page}`;

            try {

                            img_src: item.img_src || item.thumbnail_src,

                        }));

            const rawText = await fetchTextWithProxy(targetUrl);
            if (rawText) {
                try {
                    const data = JSON.parse(rawText);
                    if (data.results && data.results.length > 0) {
                        return data.results.map(item => ({
                            title: item.title || query,
                            url: item.url || item.img_src,
                            img_src: item.img_src || item.thumbnail_src,
                            source_name: item.engine || ''
                        }));
                    }

        async function fetchFastSerpApiSearch(query, page = 1) {
            if (SERPAPI_KEYS_WEB && SERPAPI_KEYS_WEB.length > 0) {
                const start = (page - 1) * 10;

                for (let i = 0; i < SERPAPI_KEYS_WEB.length; i++) {
                    const idx = (currentWebKeyIdx + i) % SERPAPI_KEYS_WEB.length;
                    const key = SERPAPI_KEYS_WEB[idx];
                    const targetUrl = `https://serpapi.com/search.json?engine=google&q=${encodeURIComponent(query)}&hl=ja&gl=jp&start=${start}&api_key=${key}`;

                    const rawText = await fetchTextWithProxy(targetUrl);
                    if (rawText) {
                        try {
                            const data = JSON.parse(rawText);
                            if (data.organic_results && data.organic_results.length > 0) {
                                currentWebKeyIdx = idx;
                                return data.organic_results.map(item => ({
                                    title: item.title,
                                    url: item.link,
                                    content: item.snippet || ''
                                }));
                            }
                        } catch (e) {}
                    }
                }
            }

            const searxResults = await fetchSearxngWeb(query, page);
            if (searxResults.length > 0) return searxResults;

            return await fetchWikipediaSearch(query);
        }

        async function fetchImageSearch(query, page = 1) {
            if (SERPAPI_KEYS_IMAGE && SERPAPI_KEYS_IMAGE.length > 0) {
                const start = (page - 1) * 10;

                for (let i = 0; i < SERPAPI_KEYS_IMAGE.length; i++) {
                    const idx = (currentImageKeyIdx + i) % SERPAPI_KEYS_IMAGE.length;
                    const key = SERPAPI_KEYS_IMAGE[idx];
                    const targetUrl = `https://serpapi.com/search.json?engine=google_images&q=${encodeURIComponent(query)}&gl=jp&hl=ja&start=${start}&api_key=${key}`;

                    const rawText = await fetchTextWithProxy(targetUrl);
                    if (rawText) {
                        try {
                            const data = JSON.parse(rawText);
                            if (data.images_results && data.images_results.length > 0) {
                                currentImageKeyIdx = idx;
                                return data.images_results.map(item => ({
                                    title: item.title || query,
                                    url: item.link || item.original,
                                    img_src: item.thumbnail || item.original,
                                    source_name: item.source || ''
                                }));
                            }
                        } catch (e) {}
                    }
                }
            }

            const searxResults = await fetchSearxngImages(query, page);
            if (searxResults.length > 0) return searxResults;

            return await fetchWikipediaImageFallback(query);
        }

        async function fetchWikipediaImageFallback(query) {
            try {
                const res = await fetch(`https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=18&prop=pageimages&pithumbsize=600&format=json&origin=*`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.query?.pages) {
                        return Object.values(data.query.pages)
                            .filter(p => p.thumbnail?.source)
                            .map(p => ({
                                title: p.title,
                                url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(p.title)}`,
                                img_src: p.thumbnail.source,
                                source_name: 'Wikipedia'
                            }));
                    }
                }
            } catch(e) {}
            return [];
        }

        async function fetchNewsMultiAPI(query, page) {
            let results = [];
            try {
                const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=ja&gl=JP&ceid=JP:ja`;
                const xmlText = await fetchTextWithProxy(rssUrl);

                if (xmlText) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                    const items = xmlDoc.querySelectorAll('item');

                    items.forEach(item => {
                        const title = item.querySelector('title')?.textContent || '';
                        const link = item.querySelector('link')?.textContent || '';
                        const pubDate = item.querySelector('pubDate')?.textContent || '';

                        if (title && link) {
                            results.push({
                                title: title,
                                url: link,
                                content: `掲載日時: ${new Date(pubDate).toLocaleString('ja-JP')}`
                            });
                        }
                    });
                }
            } catch(e) {}

            if (results.length === 0) results = await fetchWikipediaSearch(query);
            return results;
        }

        async function fetchWikipediaSearch(query) {
            try {
                const res = await fetch(`https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
                if(res.ok) {
                    const data = await res.json();
                    if (data.query?.search) {
                        return data.query.search.map(item => ({
                            title: item.title,
                            url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(item.title)}`,
                            content: item.snippet.replace(/<\/?[^>]+(>|$)/g, "")
                        }));
                    }
                }
            } catch(e) {}
            return [];
        }

        async function fetchWikipediaKnowledgePanel(query) {
            const sidebar = document.getElementById('sidebar');
            try {
                const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.extract) {
                        sidebar.innerHTML = `
                            <div class="knowledge-card">
                                <div class="knowledge-title">${data.title}</div>
                                <div class="knowledge-subtitle">関連情報 (Wikipedia)</div>
                                <div class="knowledge-desc">${data.extract}</div>
                                <a href="${data.content_urls.desktop.page}" target="_blank" class="knowledge-link">詳細を見る →</a>
                            </div>
                        `;
                        sidebar.classList.add('active');
                        return;
                    }
                }
            } catch (err) {}
            sidebar.classList.remove('active');
        }

        async function fetchOmadaMedia(query, page) {
            const omadaApi = document.getElementById('settingOmadaApi').value || 'https://yt.omada.cafe';
            try {
                const res = await fetch(`${omadaApi}/api/v1/search?q=${encodeURIComponent(query)}&page=${page}&type=video`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                return (Array.isArray(data) ? data : []).map(v => {
                    const isLive = v.isLive === true || v.liveNow === true || (v.lengthSeconds === 0 && !v.isUpcoming);
                    return {
                        title: v.title,
                        videoId: v.videoId,
                        author: v.author || '不明',
                        lengthText: isLive ? 'ライブ' : `${Math.floor((v.lengthSeconds || 0)/60)}分${(v.lengthSeconds || 0)%60}秒`,
                        viewCountText: v.viewCount ? `${v.viewCount.toLocaleString()} 回視聴` : '',
                        isLive: isLive
                    };
                });
            } catch (err) {
                return [];
            }
        }

        async function fetchSideShorts(query) {
            const sidebar = document.getElementById('sidebar');
            const omadaApi = document.getElementById('settingOmadaApi').value || 'https://yt.omada.cafe';
            try {
                const res = await fetch(`${omadaApi}/api/v1/search?q=${encodeURIComponent(query + ' #shorts')}&type=video`);
                if (!res.ok) return;
                const data = await res.json();
                
                const shorts = (Array.isArray(data) ? data : []).filter(v => {
                    const duration = v.lengthSeconds || 0;
                    const isShortTitle = v.title ? v.title.toLowerCase().includes('#shorts') || v.title.toLowerCase().includes('short') : false;
                    return (duration > 0 && duration <= 60) || isShortTitle;
                }).slice(0, 6);

                if (shorts.length === 0) return;

                let shortsHtml = `
                    <div class="knowledge-card">
                        <div class="sidebar-section-title">⚡ ショート動画</div>
                        <div class="shorts-scroll-container">
                `;

                shorts.forEach(s => {
                    const thumbUrl = `https://i.ytimg.com/vi/${s.videoId}/hqdefault.jpg`;
                    shortsHtml += `
                        <div class="short-item-card" onclick="openVideoDetails('${s.videoId}')">
                            <img class="short-item-thumb" src="${thumbUrl}" alt="short" loading="lazy">
                            <div class="short-item-title">${s.title}</div>
                        </div>
                    `;
                });

                shortsHtml += `</div></div>`;

                if (sidebar.innerHTML.includes('video-detail-panel')) {
                    sidebar.insertAdjacentHTML('afterbegin', shortsHtml);
                } else {
                    sidebar.innerHTML = shortsHtml;
                }
                sidebar.classList.add('active');
            } catch (e) {}
        }

        function renderNocookieEmbed(container, videoId) {
            container.innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1" 
                    style="width:100%; height:220px; border:none; border-radius:8px; background:#000;" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        }

        async function fetchComments(videoId, targetContainer) {
            const omadaApi = document.getElementById('settingOmadaApi').value || 'https://yt.omada.cafe';
            try {
                const res = await fetch(`${omadaApi}/api/v1/comments/${videoId}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                const comments = data.comments || [];
                
                if (comments.length === 0) {
                    targetContainer.innerHTML = `<div style="color:var(--text-muted); font-size:12px;">コメントはありません</div>`;
                    return;
                }

                let html = '<div class="comments-list">';
                comments.slice(0, 10).forEach(c => {
                    html += `
                        <div class="comment-item">
                            <div class="comment-author">${c.author}</div>
                            <div class="comment-content">${c.contentHtml || c.content}</div>
                        </div>
                    `;
                });
                html += '</div>';
                targetContainer.innerHTML = html;
            } catch (e) {
                targetContainer.innerHTML = `<div style="color:var(--text-muted); font-size:12px;">コメントを読み込めませんでした</div>`;
            }
        }

        async function openVideoDetails(videoId) {
            const sidebar = document.getElementById('sidebar');
            const omadaApi = document.getElementById('settingOmadaApi').value || 'https://yt.omada.cafe';

            sidebar.innerHTML = `<div class="video-detail-panel"><div style="color:var(--text-muted); font-size:13px;">動画情報を読み込み中...</div></div>`;
            sidebar.classList.add('active');

            let videoData = null;
            try {
                const res = await fetch(`${omadaApi}/api/v1/videos/${videoId}`);
                if (res.ok) videoData = await res.json();
            } catch(e) {}

            let streamUrl = null;
            if (videoData?.formatStreams?.length) {
                streamUrl = videoData.formatStreams[0].url;
            } else {
                streamUrl = `${omadaApi}/latest_version?id=${videoId}&itag=22`;
            }

            const title = videoData ? videoData.title : '動画再生';
            const author = videoData ? videoData.author : '';
            const description = videoData ? (videoData.description || '概要欄はありません。') : '';

            sidebar.innerHTML = `
                <div class="video-detail-panel">
                    <div id="videoPlayerContainer">
                        <video class="video-player-element" style="width:100%; border-radius:8px; background:#000;" controls autoplay src="${streamUrl}" onerror="renderNocookieEmbed(document.getElementById('videoPlayerContainer'), '${videoId}')"></video>
                    </div>
                    <div class="detail-title" style="margin-top:12px;">${title}</div>
                    <div class="detail-author">${author}</div>
                    <div class="detail-desc">${description}</div>

                    <div class="sidebar-section-title">💬 コメント</div>
                    <div id="commentsContainer">
                        <div style="color:var(--text-muted); font-size:12px;">コメント読み込み中...</div>
                    </div>
                </div>
            `;

            fetchSideShorts(currentQuery || title);
            fetchComments(videoId, document.getElementById('commentsContainer'));
        }

        /* 新ショッピングAPI: 楽天市場商品検索 API */
        async function fetchRakutenShoppingAPI(query, page) {
            const appId = document.getElementById('settingRakutenAppId').value || '1018224734614210871';
            const apiUrl = `https://app.rakuten.co.jp/services/api/IchibaItem/Search/20170426?format=json&keyword=${encodeURIComponent(query)}&page=${page}&hits=20&applicationId=${appId}`;

            try {
                const res = await fetch(apiUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (data?.Items) {
                        return data.Items.map(wrapper => {
                            const item = wrapper.Item;
                            const img = item.mediumImageUrls?.[0]?.imageUrl || item.smallImageUrls?.[0]?.imageUrl || '';
                            return {
                                title: item.itemName,
                                url: item.itemUrl,
                                price: item.itemPrice ? `¥${item.itemPrice.toLocaleString()}` : '価格情報なし',
                                img_src: img.replace('?_ex=128x128', '?_ex=300x300'),
                                seller: item.shopName || '楽天市場'
                            };
                        });
                    }
                }
            } catch(e) {
                const rawText = await fetchTextWithProxy(apiUrl);
                if (rawText) {
                    try {
                        const data = JSON.parse(rawText);
                        if (data?.Items) {
                            return data.Items.map(wrapper => {
                                const item = wrapper.Item;
                                const img = item.mediumImageUrls?.[0]?.imageUrl || item.smallImageUrls?.[0]?.imageUrl || '';
                                return {
                                    title: item.itemName,
                                    url: item.itemUrl,
                                    price: item.itemPrice ? `¥${item.itemPrice.toLocaleString()}` : '価格情報なし',
                                    img_src: img.replace('?_ex=128x128', '?_ex=300x300'),
                                    seller: item.shopName || '楽天市場'
                                };
                            });
                        }
                    } catch(err) {}
                }
            }
            return [];
        }

        async function fetchITunesMusicAPI(query) {
            const apiUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=24&country=JP`;
            try {
                const res = await fetch(apiUrl, { signal: AbortSignal.timeout(2000) });
                if (res.ok) {
                    const data = await res.json();
                    if (data.results) {
                        return data.results.map(song => ({
                            title: song.trackName,
                            artist: song.artistName,
                            album: song.collectionName,
                            img_src: song.artworkUrl100?.replace('100x100bb', '300x300bb') || '',
                            previewUrl: song.previewUrl,
                            url: song.trackViewUrl
                        }));
                    }
                }
            } catch(e) {}
            return [];
        }

        function getDomain(urlStr) {
            try {
                const u = new URL(urlStr);
                return u.hostname.replace('www.', '');
            } catch(e) {
                return 'Web';
            }
        }

        function openImageViewer(index) {
            if (!currentImagesData || !currentImagesData[index]) return;
            activeImageIndex = index;
            const item = currentImagesData[index];
            const domain = item.source_name || getDomain(item.url);
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${getDomain(item.url)}&sz=32`;

            document.getElementById('viewerSiteIcon').src = faviconUrl;
            document.getElementById('viewerSiteName').textContent = domain;
            document.getElementById('viewerMainImg').src = item.img_src;
            document.getElementById('viewerTitle').textContent = item.title;
            document.getElementById('viewerVisitLink').href = item.url;

            const relatedContainer = document.getElementById('viewerRelatedGrid');
            relatedContainer.innerHTML = '';
            
            const relatedImages = currentImagesData.filter((_, i) => i !== index).slice(0, 8);
            let relatedHtml = '';
            relatedImages.forEach((relItem) => {
                const relDomain = relItem.source_name || getDomain(relItem.url);
                const relFavicon = `https://www.google.com/s2/favicons?domain=${getDomain(relItem.url)}&sz=32`;
                const origIndex = currentImagesData.indexOf(relItem);
                relatedHtml += `
                    <div class="image-card" onclick="openImageViewer(${origIndex})">
                        <img src="${relItem.img_src}" loading="lazy" alt="img" onerror="this.src='https://via.placeholder.com/200x150?text=No+Image'">
                        <div class="image-card-info">
                            <div class="image-card-title">${relItem.title}</div>
                            <div class="image-card-source">
                                <img src="${relFavicon}" onerror="this.style.display='none'">
                                <span>${relDomain}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            relatedContainer.innerHTML = relatedHtml;

            document.getElementById('imageViewerModal').classList.add('active');
        }

        function closeImageViewer() {
            document.getElementById('imageViewerModal').classList.remove('active');
        }

        function navigateViewer(dir) {
            let newIndex = activeImageIndex + dir;
            if (newIndex >= 0 && newIndex < currentImagesData.length) {
                openImageViewer(newIndex);
            }
        }

        function copyViewerLink() {
            if (currentImagesData[activeImageIndex]) {
                navigator.clipboard.writeText(currentImagesData[activeImageIndex].url);
                alert('リンクをコピーしました');
            }
        }

        function renderResults(results, isNextPage, type) {
            const resultsDiv = document.getElementById('results');
            if(!isNextPage) resultsDiv.innerHTML = '';

            if (!results || results.length === 0) {
                if (!isNextPage && resultsDiv.innerHTML === '') {
                    resultsDiv.innerHTML = `<div class="result-item" style="color:var(--text-muted)">検索結果が見つかりませんでした。</div>`;
                }
                hasMoreResults = false;
                return;
            }

            if (type === 'images') {
                if (!isNextPage) currentImagesData = [];
                const startIdx = currentImagesData.length;
                currentImagesData = currentImagesData.concat(results);

                let grid = resultsDiv.querySelector('.image-grid');
                if (!grid) {
                    grid = document.createElement('div');
                    grid.className = 'image-grid';
                    resultsDiv.appendChild(grid);
                }
                let html = '';
                results.forEach((item, i) => {
                    const globalIdx = startIdx + i;
                    const domain = item.source_name || getDomain(item.url);
                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${getDomain(item.url)}&sz=32`;
                    html += `
                        <div class="image-card" onclick="openImageViewer(${globalIdx})">
                            <img src="${item.img_src}" loading="lazy" alt="img" onerror="this.src='https://via.placeholder.com/200x150?text=No+Image'">
                            <div class="image-card-info">
                                <div class="image-card-title">${item.title}</div>
                                <div class="image-card-source">
                                    <img src="${faviconUrl}" onerror="this.style.display='none'">
                                    <span>${domain}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                grid.insertAdjacentHTML('beforeend', html);
            } else if (type === 'videos') {
                const fragment = document.createDocumentFragment();
                results.forEach(item => {
                    const thumbUrl = `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`;
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => openVideoDetails(item.videoId);
                    
                    const badgeHtml = item.isLive 
                        ? `<div class="live-badge"><span class="live-dot"></span> ライブ</div>` 
                        : '';

                    card.innerHTML = `
                        <div class="video-card-thumb">
                            <img src="${thumbUrl}" alt="thumb" loading="lazy">
                            ${badgeHtml}
                        </div>
                        <div class="video-card-info">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">${item.author} • ${item.lengthText} ${item.viewCountText ? '• ' + item.viewCountText : ''}</div>
                        </div>
                    `;
                    fragment.appendChild(card);
                });
                resultsDiv.appendChild(fragment);
            } else if (type === 'shopping') {
                let grid = resultsDiv.querySelector('.shopping-grid');
                if (!grid) {
                    grid = document.createElement('div');
                    grid.className = 'shopping-grid';
                    resultsDiv.appendChild(grid);
                }
                let html = '';
                results.forEach(item => {
                    html += `
                        <a href="${item.url}" class="card" target="_blank">
                            <img src="${item.img_src}" loading="lazy" alt="item" onerror="this.src='https://via.placeholder.com/200x160?text=No+Image'">
                            <div class="card-body">
                                <div class="card-title">${item.title}</div>
                                <div class="card-price">${item.price}</div>
                                <div class="card-meta">${item.seller}</div>
                            </div>
                        </a>
                    `;
                });
                grid.insertAdjacentHTML('beforeend', html);
            } else if (type === 'music') {
                let grid = resultsDiv.querySelector('.music-grid');
                if (!grid) {
                    grid = document.createElement('div');
                    grid.className = 'music-grid';
                    resultsDiv.appendChild(grid);
                }
                let html = '';
                results.forEach(item => {
                    html += `
                        <div class="card">
                            <img src="${item.img_src}" loading="lazy" alt="artwork">
                            <div class="card-body">
                                <a href="${item.url}" target="_blank" class="card-title">${item.title}</a>
                                <div class="card-meta">${item.artist} - ${item.album}</div>
                                <audio controls src="${item.previewUrl}"></audio>
                            </div>
                        </div>
                    `;
                });
                grid.insertAdjacentHTML('beforeend', html);
            } else {
                let html = '';
                results.forEach(item => {
                    html += `
                        <div class="result-item">
                            <a href="${item.url}" class="result-title" target="_blank">${item.title}</a>
                            <div class="result-url">${item.url}</div>
                            <div class="result-snippet">${item.content}</div>
                        </div>
                    `;
                });
                resultsDiv.insertAdjacentHTML('beforeend', html);
            }
        }

        function handleAutoScroll() {
            if (isLoading || !hasMoreResults || !currentQuery) return;
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            if (scrollTop + clientHeight >= scrollHeight - 400) {
                currentPage++;
                executeSearch(true);
            }
        }
    </script>
